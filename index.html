<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FLIP · 随手翻</title>
<style>
  :root{
    --paper:#fafaf8;
    --ink:#0a0a0a;
    --muted:#6f6f6a;
    --faint:#a8a8a2;
    --card:#ecece8;
    --card2:#e3e3de;
    --accent:#D71A1B;
    --accent-on:#ffffff;
    --line:rgba(10,10,10,.08);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Inter,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --serif:Georgia,"Times New Roman","Songti SC",serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --reader-size:17px;
    --reader-font:var(--sans);
    --reader-leading:1.78;
  }
  body.dark{
    --paper:#0e0e0c;
    --ink:#ecece8;
    --muted:#9a9a92;
    --faint:#686864;
    --card:#1a1a18;
    --card2:#232321;
    --accent:#E5484D;
    --accent-on:#ffffff;
    --line:rgba(236,236,232,.09);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;font-size:13px;font-weight:600;
    letter-spacing:.04em;border-radius:0;transition:transform .05s ease,opacity .2s;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:var(--accent-on)}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn.ghost:hover{background:var(--card2)}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:var(--paper);
    border-bottom:2px solid var(--ink);
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logo{font-size:21px;font-weight:800;letter-spacing:.18em;display:flex;align-items:center}
  .logo .dot{width:11px;height:11px;background:var(--accent);margin-left:8px;display:inline-block}
  .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .top-actions{display:flex;gap:8px}

  /* ---------- library layout ---------- */
  .wrap{max-width:760px;margin:0 auto;padding:0 22px 90px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
  .stat{background:var(--card);padding:14px 16px}
  .stat .num{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stat .num .u{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
  .stat .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}

  /* ---------- 板块卡片 ---------- */
  .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 4px}
  .module-card{
    background:var(--card);padding:16px 14px;text-align:left;cursor:pointer;border-radius:0;
    transition:background .15s ease;-webkit-tap-highlight-color:transparent;
  }
  .module-card:hover{background:var(--card2)}
  .module-card:first-child{background:var(--accent);color:var(--accent-on)}
  .module-card:first-child .mc-desc{color:rgba(255,255,255,.75)}
  .module-card .mc-title{font-size:15px;font-weight:700;display:block;letter-spacing:-.01em}
  .module-card .mc-desc{font-size:11px;color:var(--muted);display:block;margin-top:4px;line-height:1.4}
  .home-section-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

  .toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 14px}
  .search{flex:1;position:relative}
  .search input{
    width:100%;padding:11px 14px 11px 34px;font-size:14px;
    background:var(--card);border:none;border-radius:0;color:var(--ink);outline:none;
  }
  .search input::placeholder{color:var(--faint)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
  .filters{display:flex;gap:6px}
  .filters button{padding:8px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:var(--card);color:var(--muted)}
  .filters button.on{background:var(--ink);color:var(--paper)}

  /* ---------- article list ---------- */
  .list{display:flex;flex-direction:column;gap:10px}
  .card{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card);padding:18px 18px 14px;border-radius:0;
    position:relative;transition:background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card:hover{background:var(--card2)}
  .card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .card .title{font-size:18px;font-weight:650;line-height:1.35;letter-spacing:-.005em}
  .card .title .unread-dot{display:inline-block;width:7px;height:7px;background:var(--accent);margin-right:8px;vertical-align:middle;border-radius:0}
  .card .del{flex-shrink:0;color:var(--muted);font-size:17px;padding:2px 6px;opacity:.5;cursor:pointer;transition:opacity .15s}
  .card .del:hover{opacity:1;color:var(--ink)}
  .card .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .card .meta span{margin-right:12px}
  .card .bar{height:3px;background:var(--card2);margin-top:12px;overflow:hidden}
  .card .bar i{display:block;height:100%;background:var(--accent)}

  /* ---------- empty state ---------- */
  .empty{
    text-align:center;padding:72px 22px;color:var(--muted);
  }
  .empty .dots{
    width:120px;height:120px;margin:0 auto 26px;
    background-image:radial-gradient(var(--muted) 1px,transparent 1.5px);
    background-size:14px 14px;opacity:.5;
  }
  .empty h2{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  .empty p{margin-top:10px;font-size:14px;line-height:1.6}
  .empty .hint{margin-top:26px;display:inline-block;border:2px dashed var(--line);padding:14px 22px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}

  /* ---------- drop overlay ---------- */
  #dropOverlay{
    position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,10,.82);color:#fafaf8;
  }
  #dropOverlay.show{display:flex}
  #dropOverlay .box{border:2px solid #fafaf8;padding:44px 54px;text-align:center;font-size:17px;font-weight:600;letter-spacing:.04em}

  /* ---------- reader ---------- */
  .reader{display:none}
  .reader.open{display:block}
  .progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:transparent}
  .progress i{display:block;height:100%;width:0;background:var(--accent)}
  .reader-bar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:var(--paper);border-bottom:2px solid var(--ink);
  }
  .reader-controls{display:flex;gap:6px;align-items:center}
  .reader-controls button{
    min-width:34px;height:34px;padding:0 9px;font-size:13px;font-weight:600;
    background:var(--card);color:var(--ink);border-radius:0;
  }
  .reader-controls button.on{background:var(--ink);color:var(--paper)}
  .reader-controls .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

  .reader article{max-width:840px;margin:0 auto;padding:40px 22px 120px}
  .reader h1{
    font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.015em;
    outline:none;border-left:6px solid var(--accent);padding-left:18px;margin-bottom:14px;
  }
  .reader .meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}
  .reader .meta span{margin-right:14px}
  .body{
    font-family:var(--reader-font);
    font-size:var(--reader-size);
    line-height:var(--reader-leading);
  }
  .body p{margin:0 0 1.05em;text-align:justify;hyphens:auto;overflow-wrap:break-word}
  .body h2{font-size:1.45em;font-weight:700;margin:1.4em 0 .55em;line-height:1.3}
  .body h3{font-size:1.2em;font-weight:700;margin:1.3em 0 .5em;line-height:1.3}
  .body h4{font-size:1.05em;font-weight:700;margin:1.2em 0 .4em}
  .body blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:1.2em 0;color:var(--muted);font-size:1.18em}
  .body ul,.body ol{margin:0 0 1.05em;padding-left:1.5em}
  .body li{margin:.28em 0}
  .body code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:1px 5px}
  .body strong{font-weight:700}
  .body table{width:100%;border-collapse:collapse;margin:0 0 1.4em;font-size:.92em;display:block;overflow-x:auto}
  .body table thead th{background:var(--ink);color:var(--paper);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
  .body table tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .body table tbody tr:nth-child(even){background:var(--card)}
  .reader-end{margin-top:56px;padding-top:30px;border-top:2px solid var(--ink);display:flex;gap:10px;flex-wrap:wrap}
  .reader-end .done{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:11px 18px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 划线高亮（荧光黄） ---------- */
  .hl{
    background:#FFF176;
    color:inherit;
    padding:0 2px;border-radius:2px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  body.dark .hl{background:#8a7a2a;color:#fff}

  /* ---------- 选中浮动工具条 ---------- */
  #selToolbar{
    position:fixed;z-index:150;display:none;align-items:center;gap:2px;
    background:var(--ink);color:var(--paper);padding:4px;border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.28);
  }
  #selToolbar.show{display:flex}
  #selToolbar button{
    color:var(--paper);padding:7px 12px;font-size:13px;font-weight:600;border-radius:6px;white-space:nowrap;
  }
  #selToolbar button:active{background:rgba(255,255,255,.18)}
  #selToolbar button.on{color:var(--accent)}

  /* ---------- 语言要点提示卡片 ---------- */
  #exprTip{
    position:fixed;z-index:185;display:none;max-width:78vw;
    background:var(--ink);color:var(--paper);padding:14px 18px;border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  #exprTip.show{display:block}
  #exprTip .et-word{font-size:18px;font-weight:700;color:#7cc7ff}
  #exprTip .et-meaning{font-size:15px;line-height:1.55;margin-top:6px;color:var(--paper)}
  body.dark #exprTip{background:#1c1e22}
  body.dark #exprTip .et-word{color:#8ec5ff}

  /* ---------- 字典面板 ---------- */
  #dictPanel{
    position:fixed;z-index:160;left:0;right:0;bottom:0;
    background:var(--paper);border-top:2px solid var(--ink);
    max-height:62vh;overflow:auto;
    transform:translateY(105%);transition:transform .25s ease;
    padding:0 0 18px;
  }
  #dictPanel.show{transform:translateY(0)}
  #parsePanel{
    position:fixed;z-index:170;left:0;right:0;bottom:0;
    background:var(--paper);border-top:2px solid var(--ink);
    max-height:62vh;overflow:auto;
    transform:translateY(105%);transition:transform .25s ease;
    padding:0 0 18px;
  }
  #parsePanel.show{transform:translateY(0)}
  #selToolbar #parseBtn{display:none}
  #selToolbar #parseBtn.show{display:inline-flex}
  #selToolbar #vocabBtn{display:none}
  #selToolbar #vocabBtn.show{display:inline-flex}

  /* API 设置弹窗 */
  #keyModal{
    position:fixed;inset:0;z-index:220;display:none;
    align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:20px;
  }
  #keyModal.show{display:flex}
  .key-card{
    background:var(--paper);border-radius:14px;padding:22px 22px 18px;width:100%;max-width:420px;
    box-shadow:0 12px 44px rgba(0,0,0,.32);
  }
  .key-title{font-size:18px;font-weight:750;letter-spacing:-.01em;margin-bottom:6px}
  .key-label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .key-card input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);font-size:15px;outline:none;
  }
  .key-card input:focus{border-color:var(--accent)}
  .key-actions{display:flex;gap:8px;margin-top:18px}
  .key-actions .btn{flex:1;justify-content:center}
  .key-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.55}
  .dict-head{
    position:sticky;top:0;background:var(--paper);z-index:2;
    display:flex;align-items:baseline;gap:10px;
    padding:16px 20px 12px;border-bottom:1px solid var(--line);
  }
  .dict-head .w{font-size:26px;font-weight:750;letter-spacing:-.01em}
  .dict-head .ph{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .dict-head .x{margin-left:auto;font-size:20px;color:var(--muted);padding:2px 8px}
  .dict-body{padding:6px 20px}
  .dict-pos{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px}
  .dict-def{font-size:17px;line-height:1.65;margin:0 0 8px}
  .dict-def::before{content:"· ";color:var(--accent)}
  .dict-err{padding:24px 20px;color:var(--muted);font-size:14px}
  .dict-loading{padding:24px 20px;color:var(--muted);font-size:14px}
  .dict-actions{display:flex;gap:8px;padding:4px 20px 0}
  .dict-actions .btn{flex:1;justify-content:center}
  .dict-section{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px;font-weight:700}
  .dict-section:first-child{margin-top:4px}
  .dict-context{font-size:18px;line-height:1.75;color:#3a2f22;background:#f5efe0;padding:14px 16px;border-left:3px solid #b78a5e}
  .dict-cn{font-size:16px;line-height:1.7;color:#3a2f22;margin:0 0 8px}
  .dict-cn:last-of-type{margin-bottom:2px}
  .dict-example{display:block;font-size:19px;line-height:1.7;color:#5a4a38;margin:0 0 14px;background:#fbf7ee;padding:10px 14px;border-radius:8px}
  .dict-ex-num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-right:8px;background:#b78a5e;color:#fff;border-radius:50%;font-size:12px;font-weight:700;vertical-align:1px}

  /* ---------- 生词本视图 ---------- */
  .vocab-view{display:none}
  .vocab-view.open{display:block}
  .vocab-wrap{max-width:760px;margin:0 auto;padding:18px 20px 90px}
  .vocab-item{
    display:block;background:var(--card);border-radius:12px;
    padding:18px 20px 16px;margin-bottom:12px;cursor:pointer;
    transition:background .15s ease;-webkit-tap-highlight-color:transparent;
  }
  .vocab-item:hover{background:var(--card2)}
  .vocab-head{display:flex;justify-content:space-between;align-items:baseline}
  .vocab-item .w{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .vocab-item .del{flex-shrink:0;color:var(--muted);font-size:22px;padding:2px 8px;cursor:pointer;opacity:.5}
  .vocab-item .del:hover{opacity:1;color:var(--ink)}
  .vocab-def{font-size:20px;color:#3a2f22;line-height:1.6;margin-top:10px}
  .vocab-example{font-size:24px;line-height:1.6;color:#2a1e13;background:#f7ecd7;padding:14px 16px;border-left:4px solid #9b5a2e;border-radius:0 8px 8px 0;margin-top:12px}
  .vocab-src{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--faint);margin-top:10px}
  .vocab-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:17px}

  /* ---------- Takeaway points（大脑分析 + 生词） ---------- */
  .takeaway-section-title{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin:26px 0 12px;font-weight:700;
  }
  .takeaway-section-title:first-child{margin-top:0}
  .takeaway-item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:14px;
  }
  .takeaway-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .takeaway-head .p{font-size:19px;font-weight:700;line-height:1.45;color:var(--ink)}
  .takeaway-head .del{flex-shrink:0;color:var(--muted);font-size:20px;padding:2px 8px;cursor:pointer;opacity:.5}
  .takeaway-head .del:hover{opacity:1;color:var(--ink)}
  .takeaway-src{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:10px;letter-spacing:.04em}
  .takeaway-body{font-size:16px;line-height:1.75;color:#3a2f22}
  .takeaway-body h4{margin:14px 0 6px;font-size:17px;font-weight:750;color:var(--ink)}
  .takeaway-body p{margin:0 0 8px}
  .takeaway-body ul{margin:6px 0 10px;padding-left:20px}
  .takeaway-body li{margin-bottom:4px}
  .takeaway-body strong{color:var(--ink)}

  /* ---------- 经济学人板块 ---------- */
  .eco-wrap{max-width:720px;margin:0 auto;padding:18px 20px 90px}
  .eco-section-title{
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:22px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);
  }
  .eco-section-title:first-child{margin-top:2px}
  .eco-item{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card);padding:20px 20px 16px;margin-bottom:12px;border-radius:0;
    transition:background .15s ease;-webkit-tap-highlight-color:transparent;
  }
  .eco-item:hover{background:var(--card2)}
  .eco-item .t{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .eco-item .m{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .eco-item .p{font-size:14.5px;line-height:1.65;color:var(--muted);margin-top:10px}
  .eco-item .cta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);margin-top:10px}

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .tagline{display:none}
    .reader h1{font-size:26px}
    .filters button{padding:8px 10px}
    .btn{padding:9px 13px}
  }

  /* ============ 少数派风 · 首页（仅文库页 #library） ============ */
  #library{
    --paper:#ffffff;
    --card:#f7f8fa;
    --card2:#eef0f3;
    --line:#e9ebee;
    --ink:#1a1a1a;
    --muted:#8a9099;
    --faint:#b6bac1;
    background:#ffffff;
  }

  /* 顶栏：白底 + 细线 */
  #library .topbar{background:#ffffff;border-bottom:1px solid var(--line);padding:16px 28px}
  #library .topbar .tagline{color:var(--muted)}
  #library .topbar .btn{border-radius:999px;padding:9px 16px;font-size:13px}
  #library .topbar .btn.ghost{background:#ffffff;border:1px solid var(--line);color:var(--ink)}
  #library .topbar .btn.ghost:hover{background:#ffffff;border-color:var(--accent);color:var(--accent)}
  #library .topbar .btn.primary{background:var(--accent);color:#ffffff}

  /* 主容器：加宽 + 留白 */
  #library .wrap{max-width:840px;padding:0 28px 110px}

  /* 三个板块卡 */
  #library .modules{grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 4px}
  #library .module-card{

{"sections":[{"key":"Leaders","label":"Leaders","articles":[{"id":"eco-1","title":"Donald Trump's humiliation offers America an opportunity","full":"SURFERS CALL it the washing machine. When a giant wave throws you off your board and plunges you underwater, you lose all sense of where you are. That is what befell Donald Trump and his party on November 3rd, as they were slammed by tens of millions of American voters. They have still to grasp just how much their country has changed.\n\nAlready it is clear this was not a normal midterm swing against a sitting president, but the biggest wave-election since the aftermath of Watergate more than 50 years ago. Democrats won control of both chambers of Congress, flipping seats deep into once-safe red waters, from South Carolina to Texas.\n\nThe coming days will spell out two further lessons. One is that this is not just a triumph for Democrats, but also for American democracy. Voters cannot be taken for granted. If they are angry, they will turn against parties they have long supported. The other lesson, which follows from this, is that both parties now need to find a new way of doing politics—one that spends less time riling up their constituents and more getting things done on their behalf.\n\nThe wave has swept across America. With some races still uncalled, the Democrats have 54 Senate seats (including two independents) and around 260 in the House, up from 47 and 214. They are set to win the popular vote for the House by 13 points. They have also taken at least five more governors' mansions. Kansas has its first Democratic senator since the New Deal. In Texas Democrats won their first Senate seat in almost 40 years and kicked out a three-term governor.\n\nIt turns out that voters do not much like a president who is elected on a promise to lower prices and stay out of wars, but who then goes on to launch a tariff crusade and attack Iran—thereby driving up prices. And they hate it if that president's relentless self-glorification and enrichment of his family and friends mocks their own hardship. In Mr Trump's America, Gallup finds, nine in ten adults complain that corruption in their government is widespread—about as many as in Nigeria.\n\nThe vote was thus a verdict on the president. But politicians from both parties should also reflect on voters' rejection of the ugly mechanics of modern partisanship. Republicans gerrymandered seats, but failed to make gains. Elon Musk, a multi-billionaire, poured more than $150m into a race in Texas, but his candidate was trounced. Republican candidates stoked fears over Muslims and transgender people, and lost. One in Ohio backed an ad in which a mother damned his opponent: her own abused daughter. It sealed his defeat.\n\nThe message from this is clear and it is hopeful. It has often seemed as if polarisation was stronger than the electoral feedback that ensures democratic accountability. Not this time. Voters demanded that politicians put the nation's prosperity above the grubby pursuit of power. Just before the election, polls say, 80% of Americans called for \"substantial change\" or \"complete and total upheaval\" in how America is run.\n\nVoters have done their job. Politicians must now do theirs. The immediate task falls to the Republicans. When Mr Trump took control of the party, he ditched its values. Most old-guard Republican politicians were either forced out of office or traded their principles for political survival. With their call for change, voters have given Republicans a second chance. Some may stick with the president, risking further drubbings in future elections. Braver souls will breathe new life into their party, even if that courts Mr Trump's vengeance. He is more feared than loved. They may discover that, once the old king's power begins to ebb, it drains away surprisingly fast.\n\nPlenty could go wrong—including with Democrats flushed by success. Their party is only a bit more popular than Mr Trump. Their campaign succeeded by pairing a promise to lower costs with one to crack down on corruption and incompetence. Both are vital, but the balance will be hard to strike.\n\nIf Democrats ignore the rot, they will only deepen voters' cynicism and despair at the federal government in Washington. But if subpoenas and impeachments consume all of their efforts and they fail to improve people's lives, voters will feel that they have been hoodwinked once again. A running fight with the administration will also make it harder to pass legislation that would, say, restore funding for health care.\n\nAbove it all will loom the legacy-obsessed figure of Mr Trump. Some hold out hope that he will spend the rest of his presidency pottering about the White House, gilding golf balls and opining on granite. That underestimates the president's capacity, for good and ill.\n\nAt home Mr Trump may focus on pardoning his friends and punishing his enemies. With only two years left, he and his cronies and ideologues may try to wring what more they can from their time in power, be that through lucrative state-supported mining ventures or more deportations.\n\nThe president also retains enormous authority over foreign policy. He may yet pursue further strikes on Iran, try to bully Ukraine into a bad deal with Russia, or invade Cuba. As the White House's more talented staff eye the exits, a depleted executive branch may find itself even more subject to the president's whims. It will be ill-prepared for a crisis.\n\nThere is a glimmer of a possibility, however, that politicians will take their responsibility seriously. Republicans in Congress may consider working with Democrats, and vice versa (imagine that). They could pursue egregious corruption or even impeach the administration's most reckless cabinet members, including Pete Hegseth, the secretary of war. They could develop rules for artificial intelligence that guard against disastrous outcomes without crippling innovation.\n\nMr Trump is not a man who enjoys being left out. He may judge that he could improve his legacy by working with Congress, rather than trampling on it. That is not the likeliest scenario, we admit. But, as the voters have shown, politicians who ignore them risk ending up in very deep water. ■","words":1011},{"id":"eco-3","title":"The world must act to stop a cyber-disaster","full":"It was meant to be \"cyber-security awareness month\". Experts now call it \"Black October\". In recent weeks the normal flow of computer hacks and bugs that engineers must constantly stem has become a torrent. The cause is artificial intelligence, which has turbocharged cyber malfeasance. Open-source AI models have empowered attackers to work with inhuman efficiency, competence and persistence. As a result, years' worth of critical flaws have been exposed in days.\n\nThose flaws range from shocking to ridiculous. Engineers have rushed to fix a flaw in PHP, a widely used programming language, that let attackers take over any computer using it. Freezers in supermarkets across Europe powered down on the instructions of cyber-criminals. And a crucial internet security certificate was revealed to have a private key of \"4\", when it should have been a hundred digits long. Nobody knows what bugs might have been found and exploited in private.\n\nThese events have been sobering for the many commentators, including this newspaper, who hoped that the disruption to cyber-security from ai would be short-lived, and that the technology itself would help those who defend digital systems more than it would empower crooks. Those hopes are being dashed. Instead, the digital infrastructure on which modern life depends looks increasingly vulnerable to ai. Urgent action is needed to defend it.\n\nWhy are defenders struggling? The first reason is that many of them do not have the most advanced tools. In April Anthropic, a leading model-maker, launched \"Project Glasswing\", an invitation-only club with access to the full cyber capabilities of its frontier models. It originally intended to broaden the membership widely. A similar programme from OpenAI was launched with a promise to democratise access to its tools.\n\nHowever, access to powerful AI has become a geopolitical issue. Both of the model-makers now need sign-off from America's federal government before admitting new members to their clubs, so expanding them has become a painful political process. In the meantime those outside the gates must defend themselves with the same open-source tools that are powering the attacks. Some are stuck in a no-man's land: unable to access American tech, but also scared of using Chinese alternatives.\n\nThe second problem is that when AI is used benignly it creates a friendly-fire problem. The moment that a \"patch\" for a newly identified vulnerability is released, hackers' AI models can examine it. This may reveal exactly what the weakness was and how to exploit it in systems that have not yet been fixed. If defenders are really unlucky—as they were with php—the patch may leak before it is released for defenders to use to fix their code. Attackers can then operate against still-defenceless systems.\n\nA final issue is that attackers can exploit prosaic vulnerabilities faster and on a greater scale (see Business section). Cyber-security is not just about having strong systems available in theory, but avoiding laxity in practice. Unfortunately, AI has made human carelessness easier to exploit without making computer users any wiser. An internet-connected fridge running outdated software or using a default password has been a security hazard for decades. Only now, however, have attackers found it so easy to automate the search for and exploitation of weak points, running thousands of attacks in parallel.\n\nCompanies and governments must act decisively against these threats. Generating an imbalance in cyber-weaponry is crucial. With equal firepower, defenders rely on a narrow natural advantage: they must find and patch only single vulnerabilities—isolated problems which might in theory help create a breach. Attackers typically need to know of a whole chain of those vulnerabilities in order to breach a system.\n\nNow that AI-powered attacks are proliferating, this advantage is too narrow. Defenders need a bigger armoury. America's government should take a more permissive attitude to membership of cyber-defence programmes, or at least approve new joiners faster. It would also be better if attackers' capabilities were pushed further behind the frontier. China's government has recognised the folly of distributing potent cyber-weapons to all, and is requiring labs to limit the destructive potential of newly released systems.\n\nOrganisations that are not yet using AI constantly to find and close security holes have fallen behind the curve and must catch up. Some entities need more help. In America efforts like Texas's \"Project Watershed 250\" are funnelling resources to providers of infrastructure to help with the basics. Those efforts should be expanded. In time, the software industry may be able to verify some code formally, thereby proving that it is unhackable, much as a mathematician proves a theorem.\n\nCommerce, infrastructure and human relationships have come to rely on the assumption that the internet is secure. A sudden loss of cyber-security would therefore pose a grave threat to society. Cyber-security awareness has risen over the past month. Action must follow. ■","words":794},{"id":"eco-4","title":"Patients are acting more like consumers. Good","full":"The person who uses a product usually chooses it and pays for it. The great exception is health care. Most of the time insurers (public or private) decide what is covered; doctors decide what is prescribed and patients take what they are given. The result is markets riddled with inefficiency, and nowhere more so than in America, the world's biggest. This year Americans are expected to spend about $6trn on health, nearly a fifth of their country's GDP. Yet for all that money, about one adult in ten could not get an appointment when they needed one last year, and more than a quarter put off or skipped care because of the cost.\n\nNo wonder patients are taking matters into their own hands. They pepper chatbots with questions such as how to decode a blood test or prepare for an appointment; every week more than 300m people ask ChatGPT about health, says OpenAI, its creator. The market for tests that patients order themselves has grown to be worth about $4bn a year in America, double its size in 2021, reckons Morgan Stanley, a bank. And drugmakers have started selling directly to patients. Eli Lilly, an American pharmaceutical giant, now fills about half of new prescriptions for its obesity jab in America this way, bypassing insurers. All three developments are good news.\n\nOne reason is that patient-led markets bring lower prices. Take drugs. In America their true cost is obscured by a tangle of middlemen and insurers, who negotiate secret discounts from inflated list prices. When patients pay directly, prices are transparent and drugmakers must compete. New obesity drugs are a good example. Novo, a Danish drugmaker, launched Wegovy in 2021 at a list price of about $1,350 a month. That led to a price war with Lilly, and competition from cheap copies. Both firms now sell their jabs direct to patients for as little as $300-350 a month. The same logic works for older products. Mark Cuban Cost Plus Drug Company, an online pharmacy founded by a billionaire, buys generics from their makers and sells them at cost plus a 15% mark-up. One study found that patients with employer-provided insurance who pay over $15 for a prescription could buy it more cheaply from Cost Plus nearly 80% of the time.\n\nWhen patients pay, firms also come up with new ways to sell to them. \"Direct primary care\", where medical practices ditch insurers and charge patients a monthly fee instead, has grown by nearly a fifth per year since 2022, to more than 3,600 practices in America. Others, such as Amazon's One Medical, treat common ailments on a pay-per-visit basis. Drugmakers are looking at treatments that consumers will pay for, even if insurers will not. Novo is eyeing treatments for hair loss, addiction and menopause, conditions that big pharma long dismissed as unworthy of serious research. Even fighting off ageing now attracts money.\n\nMost profound of all is the erosion of the original source of market power: a doctor's hold on medical knowledge. In 1963 Kenneth Arrow, an economist, said that health care could not work like an ordinary market partly because the information a doctor possesses is \"necessarily very much greater than that of the patient, or at least so it is believed by both parties\". Technology has since narrowed that gap. Chatbots, though hardly infallible, translate medical jargon into plain English and set out the treatment options for a condition. Increasingly they work with patients' own data, too.\n\nConsumer-led health care carries dangers. The first is quackery. Websites and influencers peddle peptides and supplements that promise bigger muscles, better skin or a longer life. Many do nothing and some do harm. Regulators should make sure sellers do not lie about their products. Access matters, too. Nearly all consumer health care is paid for out of pocket, so for now it mostly serves the well-off. However, most innovations start out as luxuries and get cheaper.\n\nNo one will shop for doctors from the back of an ambulance. Complex and emergency care will stay with doctors, hospitals and insurers. But in the routine parts of medicine, patients can and should be treated as customers. A bloated, paternalistic industry has kept them waiting long enough. ■","words":704},{"id":"eco-5","title":"England's new ban on kinky porn will misfire","full":"Pornography depicting strangulation, suffocation, incest and actors pretending to be underage will be banned in England and Wales from November 6th. Few will publicly mourn the loss of videos with titles such as \"Choking gets her off\". But free expression means nothing if it does not apply to that which is objectionable.\n\nThe government argues that porn is causing real harm, by teaching young people that dangerous practices are not merely normal during sex but expected. It notes with shock a sharp rise in \"choking\". In America, Australia and Britain roughly half of sexually active 18- to 35-year-olds report having experienced this; a generation ago it was so niche that pollsters did not bother to ask about it. Mostly it is young men choking young women; sometimes, alarmingly, without prior consent.\n\nFor many worried parents, that ends the argument. But reality is muddier than the simple morality tale told by anti-porn campaigners. \"Choking\" refers to a range of acts, including light pressure on the neck, that some consenting adults find pleasurable. Evidence that porn is what made it so widespread is weak. Young people hear about sex from a variety of sources, including their peers. Under-18s in Britain are already barred from accessing porn sites, but tech-savvy ones have found ways round the age-verification system—and will find ways round the new ban, too.\n\nThe idea that the young can be prevented from hearing about kinks is implausible. Some of the acts whose depiction the government is forbidding are so popular that they appear in pop lyrics. Doja Cat, an American rapper with more than 50m monthly listeners on Spotify, offers lyrics such as: \"Spank me, slap me, choke me.\"\n\nRestrictions on free speech should be rare, narrow and clearly defined. No one doubts that governments should ban child pornography, and that this ban should be vigorously enforced. But in general people should be allowed to film acts that are legal, even if many voters find them repulsive.\n\nBritain's new law fails the test. It is both broad and unhelpfully vague. The government has not defined the acts that will be illegal to depict. Instead it expects courts to decide on a case-by-case basis. But Britain's overburdened state will find it hard to police the many difficult-to-judge edge cases that will emerge. In an industry enamoured with terms like \"mummy\" and \"daddy\", how will judges be able to decide what constitutes a depiction of incest? What about whether a hand on a consenting adult's neck constitutes strangulation? Or when fellatio crosses the line into suffocation? Courts have many more important things to do than to debate such matters, including hearing cases of actual sexual assault.\n\nSince possession of banned content is punishable by up to two years in prison, the new rules will also dilute what it means to be a sex offender. Such an important label loses value when it can be applied both to paedophiles and those harbouring a stepmum fantasy.\n\nRather than trying ineffectually to prevent the young from learning about risky acts, governments should be ensuring that they are taught about safety, consent and how to talk frankly to prospective partners about what the other person does and does not want. Sex education in most countries is dismal. In Britain it is better, but still has room for improvement. If children do not learn about sex and relationships from reliable sources, they will depend on unreliable ones.\n\nPornography is an unpopular thing to defend. But Britain has become too willing to ban anything pearl-clutchers dislike, from plastic straws to noisy protests. A ban on kinky porn may please moralists, but it should alarm anyone who cares about freedom of speech or government overreach. ■","words":617},{"id":"eco-2","title":"El Salvador's gangbuster tries his luck in Haiti","full":"Few places on Earth are as miserable as Haiti. The last elected president was tortured and shot dead in his home in 2021. Since then, gangs brandishing military-grade weapons have wrought havoc.\n\nThey have taken over large swathes of territory in and around the capital, setting up roadblocks, terrorising residents and extorting \"taxes\" from them. At least 16,000 people, mostly civilians, have been killed, and over 1.5m displaced. Life expectancy is the shortest in the Americas. Ill-funded UN-backed forces sent to quell the violence have struggled. A UN \"Gang Suppression Force\" was approved in September last year, but only about 2,000 of the 5,500 soldiers it was promised have arrived, and they rarely venture out from their base.\n\nThings are so bad that it is tempting to welcome almost any determined outsider who wants to impose order. Nayib Bukele, El Salvador's president, has just sent over 2,000 Salvadoran soldiers to Haiti. His contingent outnumbers the UN's forces. Mr Bukele is a brutal strongman but widely admired in the Americas for his crime-busting. Other countries have pledged logistical support for his intervention, including Colombia and the Dominican Republic, which shares an island with Haiti. President Donald Trump, who wants to see the region's gangs smashed, appears to have given Mr Bukele the nod.\n\nMr Bukele says his aim is to recover four Salvadoran air-force technicians who were working in the UN's Gang Suppression Force when they vanished (and were perhaps killed) in an ambush last month. But 2,000 troops does not sound like a mere rescue mission. More probably, he wants to burnish his reputation, by showing that his record of suppressing gangs at home in El Salvador can be extended abroad. Mr Bukele once bragged that he was strong enough to fix Haiti. In social-media posts he boasts he can \"finish off\" its gangs.\n\nForeign military interventions have a mixed record in Haiti. Previous UN efforts failed to calm the mayhem and sometimes added to it. A big worry about Mr Bukele's mission is that its aims are unclear. Will the Salvadorans kill some gangsters and leave quickly, or occupy parts of the country? Will they work with other foreign forces and the local army and police? Today's picture is confused, including not only the UN and the Haitian security services but also Vectus Global, a private military firm run by Erik Prince, an American with links to Trumpworld, who was hired by Haiti's government to fight the gangs with drones. The UN frets that its role is being usurped.\n\nMr Bukele is wrong if he imagines Haitian gangs are like their less scary counterparts in El Salvador. Back home Mr Bukele brought down the murder rate by locking up hordes of young men, almost 2% of the total population, without due process. (Trials, if they happen, are of hundreds of suspects at once.) By tossing aside the rulebook while also quietly negotiating with gang bosses, he made his country safer with remarkably little bloodshed: only four police officers died in the first 14 months of his crackdown. Haiti, by contrast, is more like a warzone. Gangs are stronger, the state is weaker and prisons are notorious for escapes. Victory here would be more akin to winning a civil war.\n\nMr Bukele may end up doing some good in Haiti, especially if he persuades others to send more peacekeepers. But he needs to make clear whether his soldiers will work with the UN or do their own thing. The UN could help with vetting and training, and discourage abuses against civilians. Yet Mr Bukele may prefer his own gloves-off approach. His opacity is troubling. He should spell out his intentions—and remember that it is easier to start a fight than to end one. ■","words":624}]},{"key":"China","label":"China","articles":[{"id":"cn-1","title":"Hit podcasts reveal the angst of China's youth","full":"In 2007 David Brooks, an American columnist, suggested that the period from adolescence to adulthood should be called the \"odyssey years\", alluding to the hazards of the voyage described in Homer's epic poem. This year the term's Chinese translation, aodesai shiqi, has turned viral online in China. Young people use it to describe the torments they face on life's journey including securing a job, finding a partner and getting on the housing ladder. State media, forever striving to sound upbeat, offer little guidance. Instead, growing numbers are turning to an independent and remarkably feisty forum: podcasts.\n\nOn his hit show, \"Qingdao Kuaima\", Fu Yu offers words of comfort. \"The odyssey years can transform the trivial, trial-and-error nature of life into a heroic, epic-like trajectory of personal growth,\" the 34-year-old tells his half-million listeners. It was reassuring to hear him explain why young people are insecure, a fan commented.\n\nAfter a slow start, China's podcast industry has boomed in recent years. It is still small compared with America's, but it is tapping into huge demand from angst-ridden youngsters. Enthusiasts call 2020 \"year zero\". That was when China's first big podcast app, Xiaoyuzhou, or \"Little Universe\", was launched. It made finding and hosting shows much easier. Now more than one in ten people in China, about 150m, tune into podcasts on Xiaoyuzhou, Himalaya and other Chinese apps, reckons the Chinese Podcast Association, an industry group. Users of Xiaoyuzhou listen for an average of 80 minutes per day; more than 80% are aged between 18 and 35.\n\nThough few podcasts are state-run, they still have to heed censors' guidelines. In public, no one may question the Communist Party's rule. But podcasts are changing the media landscape by providing room for more open discussion. State media shun mention of the love lives of gay and lesbian people; social media sometimes scrub references to the topic. Podcasts offer more freedom. They don't have to use coded language or euphemisms, says Huang Yalan of Jinan University. The government is suspicious of feminism, but many hosts are proudly feminist and eagerly discuss women's rights.\n\nThe slow-burn style of many podcasts gives them protection. Fifteen-second videos on platforms such as Douyin (as TikTok is known in China) are more likely to run afoul of censors because they need to make a striking point to attract viewers. People with the patience to listen to an hour-long show are unlikely to report transgressions, says Yi Yang, who co-founded JustPod, China's largest podcast-production firm.\n\nIn 2025 the most listened-to genre on Xiaoyuzhou was personal growth. Liu Hongxing, a data analyst in Beijing, likes a podcast of this type called \"Self-Evolution Theory\", which is the app's third-most-popular. She says it has introduced her to the idea of living the way she wants to. Previously young people thought self-improvement was about becoming cleverer, says Mr Yang. Recently it has become more about meditating, receiving therapy and learning to understand that life's problems are not all one's own fault.\n\nThe longer length of podcasts creates room for reflection, whereas short videos tend to oversimplify and stoke anger, says Mr Fu, the podcaster. \"Young people...are experiencing anxiety, confusion and pain,\" he says. But he refuses to join those who grumble about the privileges enjoyed by the older generation, who have spent much of their adulthood in years of staggering economic growth. Armed with a sociology PhD, he aims to help young people understand the forces behind their problems, such as finding a stable job or—for those who want to opt out of the rat race—deciding where to retreat.\n\nBlake Chen, the 33-year-old founder of a media company in Guangzhou, a southern city, says his generation has never been able to find its place. He believes the gap between young people and their parents is vast—much larger than that between their parents and grandparents. So the young seek guidance from peers. A popular podcast made by Mr Chen's firm discusses topics such as how to manage inter-generational conflict and whether to marry. Some hit podcasts are hosted by older professionals. Qian Jing, a professor, invites young people to call in with their woes, exuding authority as she tells them how to cope with burnout and find meaning in life. Zhang Chun, a psychological counsellor, describes her own podcast, which is also in the top 50, as collective therapy.\n\nIn a leafy district of eastern Beijing, Daxiao Café's free recording studio has hosted more than 200 podcasts about everything from psychology and women's health to running and books. Few presenters aim to make money (and few do): they simply enjoy airing views and connecting with others. But this may change—brands are eyeing opportunities. Giada, a luxury fashion firm, launched Xiaoyuzhou's top podcast called \"Flower on the Rock\", which features interviews with women. The host is Chen Luyu, often described as China's Oprah Winfrey.\n\nAs podcasts expand their reach, however, censors will pay more attention. Some apps already use artificial intelligence to screen content. In August regulators called for \"red lines\" to be drawn around podcast content and said it should uphold \"mainstream values\". One show sometimes posts short clips on Xiaoyuzhou saying an episode cannot be uploaded for \"technical reasons\"—meaning, presumably, problems with censors. But it tells listeners how to find the podcast elsewhere. ■\n\nSubscribers can sign up to Drum Tower, our new weekly newsletter, to understand what the world makes of China—and what China makes of the world.","words":903},{"id":"cn-2","title":"China and Taiwan are fighting over Sun Yat-sen","full":"On both sides of the Taiwan Strait, there are many roads, districts and schools named after the father of modern China: Sun Yat-sen, the country's first president after a republican revolution in 1911. Ten years ago, when President Xi Jinping urged \"all Chinese who revere Mr Sun Yat-sen\" to unite, the fight over his legacy was not so fierce. Now, ahead of the 160th anniversary of his birth on November 12th, cross-strait relations are far more tense. Sun has become a political lightning rod.\n\nAcross China, the government has been whipping up Sun mania. Exhibitions, concerts and seminars praise Sun's devotion to \"revitalising\" a poor and weak China. Mr Xi is expected to address a decennial Sun-themed pow-wow in Beijing. Of Sun's \"Three Principles of the People\" (nationalism, democracy and welfare), Mr Xi stresses the first. He invokes Sun's concept of national unity to promote his own aim of unifying Taiwan with the mainland. At the 150th anniversary of Sun's birthday, Mr Xi vowed to \"continue to fight for the revitalisation of China\".\n\nTaiwanese officials are pushing back. This year they warned the island's people not to attend China's commemorations. In October the government's Mainland Affairs Council said it would not allow serving or former officials to join the gathering in Beijing (in 2016 about 30 retired Taiwanese generals took part in the corresponding celebration of Sun's birthday). \"What are Taiwanese officials afraid of?\" People's Daily, the Chinese Communist Party's main mouthpiece, asked in a recent column. They are \"terrified\" that more Taiwanese will realise their \"future development lies in a strong motherland\", it fumed.\n\nBut there is another tension: inside Taiwan. The ruling Democratic Progressive Party is not nearly as pro-Sun as the opposition Kuomintang (KMT). Sun, after all, founded the KMT in 1912 (the party fled to Taiwan in 1949 after losing a civil war with the Communists). Earlier this year, China criticised Taiwan's plan to remove politicians, including Sun, from banknotes as an attempt to \"erase Chinese national identity\". There is sympathy for that view in the KMT. Much less so among young Taiwanese—while China's calls for \"national reunification\" have been growing louder, many have been leaving Sun's orbit.■\n\nSubscribers can sign up to Drum Tower, our new weekly newsletter, to understand what the world makes of China—and what China makes of the world.","words":387},{"id":"cn-3","title":"With an eye on America, China is beefing up its AI-controlled labs","full":"In a laboratory in Shenzhen, a city in southern China, hundreds of mechanical limbs dance alongside each other in search of scientific discoveries. Few humans are involved. Instead the machines are directed by artificial intelligence. An AI model devises a hypothesis, instructs robots to test it and records the results to improve its next experiment. The autonomous facility, which is owned by a drug-discovery firm called XtalPi, runs around the clock to discover new medicines. During a visit early this year, China's prime minister, Li Qiang, gushed that innovation like this was \"the key to winning the future\".\n\nIf China is to win, the loser would presumably be America. Both countries are competing to build and apply AI technologies as fast as possible. Scientific discovery may be the most important arena for this race: inventions can improve lives as well as boost a country's economic and military power. In March China's new five-year plan called for faster exploration of AI-driven ways of doing science as part of a broader push to \"seize the commanding heights in the industrial application of AI\".\n\nAs often in industry, the government is heavily involved. It is building what it calls an AI-for-science \"stack\" by linking the specialised datasets, models and computing power that are needed by firms to run autonomous labs. Experts hope these \"self-driving\" facilities will make research faster, cheaper and far more productive. China's labs are unlikely, for now, to produce big scientific breakthroughs. But they could supercharge Chinese manufacturing. Officials say they will reduce dependence on Western technology. They also hope these efforts will give China an edge in the AI race. America should pay attention.\n\nStacks like this have two layers. The first is the brains. In April the Chinese Academy of Sciences launched a platform, often dubbed an \"AI scientist\", that is available to hundreds of universities and laboratories in China. It is called ScienceOne (the Chinese name is Panshi, meaning \"Bedrock\") and resembles a chatbot. It includes models, or agents, trained on academic reports and non-text data, such as waveforms used to measure seismic vibrations. They can perform hundreds of tasks, like working out the sequences of amino acids in proteins, state media say. China's scientific models still tend to lag behind America's. But a researcher at the University of Hong Kong who uses ScienceOne praises its bundle of scientific datasets, AI agents and computing power. \"I don't see anything like it in the US,\" he says.\n\nThe second layer is the brawn. Advances in applied science need hands-on experiments. Robotised labs have existed for decades, but they require humans to analyse data and refine experiments. AI models can take over the drudgery. They can learn from the results in real time and continuously tweak their approach. Last year XtalPi used its autonomous lab in the discovery of a molecule that could be used for treating a form of stomach cancer that grows in scattered clusters of cells. The firm generated millions of possible molecules and whittled them down to hundreds of candidates before testing the remaining ones on lab-grown tissue, using robots.\n\nChina is watching America closely. It stepped up its stack-building after President Donald Trump unveiled a similar plan late last year: the \"Genesis Mission\". This also involves the government-led creation of AI platforms to test scientific hypotheses and automate experiments. Many AI researchers believe that labs full of non-human AI scientists could one day churn out everything from cancer cures to hitherto intractable proofs in physics. \"This is one area where Chinese policymakers see eye-to-eye with the American AI labs,\" says Kyle Chan of the Brookings Institution, an American think-tank.\n\nBoth countries have good reasons to involve the state. AI scientists need to be trained on large sets of data such as weather patterns and the results of past experiments. Governments, through national laboratories, are often the biggest keepers of such data. They are also well-placed to provide researchers with access to advanced computing power.\n\nBut there are differences between automated labs in America and China. In America they have been showered with venture capital: about $1bn of it last year. Recipients have mainly been startups offering speculative, eye-catching research, such as in the creation of room-temperature superconductors. Dreaming big helps them raise money, says Charles Yang, formerly of Renaissance Philanthropy, a charity that helps donors fund scientific research. In China, firms with automated labs are usually less ambitious. They like research that can quickly generate profit.\n\nChina's use of AI in scientific research is often factory-like. XtalPi's labs \"work 24/7 and the basic cost [once they are up and running] is electricity,\" says Shi Xuekun, one of the firm's managers. The company now serves 17 of the world's 20 largest pharmaceutical companies. China's biomedical industry is growing fast: last year about half of all drugs licensed globally, by value, were from China, according to Goldman Sachs, a bank—up from 21% in 2024. Smart labs are likely to account for a growing share. In March Eli Lilly secured rights to develop and sell potential drugs from Insilico Medicine, a Hong Kong-listed firm that uses automated labs. The deal could be worth up to $2.75bn.\n\nMakers of industrial materials are also likely to benefit. China is a powerhouse in materials science, publishing four times as many papers in the field as America, according to Nature, a journal. In April researchers at City University of Hong Kong showed how an automated lab could design and test molecules for light-absorbing solar cells. Robots could make the cells just as well as humans, and with far more consistency in their output. At present the average human researcher in a lab might produce one or two new cell-prototypes daily. In a joint venture with JinkoSolar, an industry titan, XtalPi says that it is building an automated facility that will test 1,000 a day.\n\nAI experts differ over the steps needed to create \"artificial general intelligence\" (AGI)—in essence, AI on steroids. Some of China's AI stars including Zhou Bowen, the boss of Shanghai AI Lab, a government-backed institute, believe models must first master sciences, and that automated labs will help them do so. Mr Shi hopes that's right: smarter models could predict the results of the experiments they design, he says. Forget humans. He may then need fewer robots, too. ■\n\nSubscribers can sign up to Drum Tower, our new weekly newsletter, to understand what the world makes of China—and what China makes of the world.","words":1075},{"id":"cn-4","title":"A new path to political power in China runs through state firms","full":"In much of the world the age of 55 is when an official might start to contemplate life after work. In the rarefied air of China's elite politics, it is roughly when careers get interesting: quinquagenarians are the sprightly young things who are just beginning to break into the upper echelons. After a reshuffle that ended last week, eight of China's 31 provinces now have governors born in 1970 or later. None of these leaders, mind you, is so green as to have been born since 1973.\n\nIt is worth looking at them more closely. Not because any will run China soon (if ever, given Xi Jinping's grip), but because, as top performers of their cohort, they reveal traits that the Communist Party values in its leaders today. A common feature is extensive experience in state-owned companies.\n\nSix of the eight governors from this youngish group rose through various appendages of China Inc. Liu Jie, now in Zhejiang province, worked for 16 years at a steel company. Guo Ningning, a rising star in Fujian, toiled for 24 years in state banks. Xie Weijiang, currently in Hunan, spent 23 years in the power sector. Of the three 1970s-born ministers in Beijing, two also worked in state-owned firms. Altogether, nearly three-quarters of the government's highest-ranking whippersnappers today are graduates of China Inc. It is starting to look like Government Sachs, with Chinese characteristics. One such characteristic, to be clear, is that the revolving door really only turns from state firms to the government, not the other way. And the corporate types still have to wait in line: the eight governors born in the 1970s all serve under provincial party secretaries born in the 1960s.\n\nRising through state firms is a change from how officials previously climbed the greasy pole. The classic path was to pay your local dues, starting in a county, becoming a small-town mayor and so on until reaching a provincial perch. Another was to get fast-tracked through the Communist Youth League. A third was the technocratic channel, especially for engineers: they might go from working on a dam to the industrial ministry and then to higher leadership. Each had drawbacks. The local route could be parochial for a global superpower. The youth league came to be seen as an arrogant faction—not least by Mr Xi as he consolidated his power. And pure engineers, most useful during China's intense phase of building, had seen their star wane in Beijing.\n\nEnter what Li Cheng of the University of Hong Kong calls \"technocrat 2.0\". Over the past five years officials with specialised training have staged a comeback. Engineers are in the mix, but their degrees are wide-ranging, from life sciences to quantum computing. A large number have also studied economics and finance. And state-owned firms are the ultimate finishing school.\n\nSome officials have always migrated from state businesses to politics. But in the past decade the door has opened more widely. In 2019 the party reworked its appointment system, creating a mechanism to shepherd more people, more quickly, from state companies into government. In 2022 Mr Li counted 86 officials born in the 1970s who had made it by then to vice-level provincial posts; 54% had worked in industrial companies or financial firms.\n\nWhy is the party turning to state executives? State firms—coddled, bloated and slow—are hardly models for the dynamic economy that the country's leaders want to build. Politically, however, there is much to recommend them. Truly national firms are not beholden to any one place. Their bosses have managed complex issues, and many know the world beyond China. Lu Dongliang, now governor of Shanxi, secured access to resources in Africa and South-East Asia as head of Chalco, the listed arm of the world's biggest aluminium producer. Zhuge Yujie, the new governor of Qinghai province, ran Shanghai's port, the world's busiest. Feng Chucheng of Hutong Research, a consultancy in Beijing, thinks the rise of state executives reflects the party's preference for leaders who, it hopes, can bring both technological self-reliance and economic resilience.\n\nDipping into state firms also broadens the talent pool for the party. It has gaping holes to fill. At an important plenary meeting last week, just 74% of the party's Central Committee (which began with 376 members) showed up in Beijing. That was the lowest attendance rate in the post-Mao half-century, confirming the extent of Mr Xi's purges. Some observers think these removals could come back to haunt Mr Xi by thinning out his bench for future appointments. In reality they are unlikely to be a constraint: China has no shortage of strivers eyeing powerful posts. It has even more now that state employees are also in the running.\n\nMr Xi's dominance can be stifling for the bureaucracy: loyalty to him is a prerequisite for advancement, which saps officials' initiative and derring-do. Yet the conveyor belt from state firms to high office shows that loyalty is a necessary, not sufficient, condition. To truly get ahead officials need to have demonstrated expertise and competence, not just ideological bona fides. In that sense the renewed emphasis on technical abilities is commendable.\n\nBut in another way it is a worrying portent for the economy. During China's decades of turbocharged growth, much of its energy derived from the retreat of the state sector and the rise of private companies. Under Mr Xi the tide has shifted. Private entrepreneurs are struggling while state firms, once again favoured by state banks and central planners, are emboldened. The systematic recruitment of state executives into government only adds to the momentum. Private companies must form party cells, but no private entrepreneur has ever become a full member of the Central Committee. For ambitious graduates entering the workforce, the signal is clear: throw your lot in with China Inc.■","words":962}]},{"key":"Asia","label":"Asia","articles":[{"id":"as-1","title":"Cheap data is great for Indians but not for India's reputation","full":"\"BITCH LASAGNA\" is the name of a song by PewDiePie. It is also a two-word social history of the relationship between India and the internet. For five years Mr Pie, a Swede whose real name is irrelevant, was the owner-operator of YouTube's most popular channel. In early 2019, after several months of back-and-forth, he was decisively overtaken by T-Series, a Bollywood studio.\n\nIn the run-up to his defeat the Swedish streamer posted what his fans described as a \"diss\", or insult, track and what anyone else would consider to be bordering on bigotry. Its lyrics include references to open defecation, ridicule of Indian languages and a meme about \"bobs or vegana\" (don't ask). The song's title alludes to a Facebook Messenger screenshot of an Indian man requesting unclothed self-portraits from a woman and, on being ignored, hurling the presumably auto-corrected epithet at her. The internet really does bring out the worst in everyone.\n\nMr Pie's battle with T-Series marked a hinge point in India's internet adoption. In 2016 Mukesh Ambani, an industrialist who inherited a petrochemical company, took literally the maxim that \"data is the new oil\" and launched Jio, a mobile network with rock-bottom prices and generous data allowances. Almost overnight the share of India's population covered by a modern mobile-broadband network jumped from 4% to 74%. A price war followed. Internet users doubled in just three years from a sixth of India's people when Jio launched to a third when T-Series triumphed, rising to over two-thirds today. A billion Indians use the internet, or three for every American.\n\nNot satisfied with bringing Indians online, Jio, which in October went public in one of the country's largest listings, also gives them something to do once they get there. Its streaming service, Hotstar, has more than 450m monthly users, well ahead of Netflix or Amazon's Prime Video. But neither Jio nor anyone else has managed to build a social space Indians prefer to Western ones. Indians are the largest nationality on YouTube, Instagram and Facebook and a significant minority on X, Reddit and Snapchat. Their influx onto these platforms has not been great for India's image in the world.\n\n\"Bitch Lasagna\", though tasteless, reflects a common stereotype online of Indian men as forever propositioning women on social media. The idea of India as an unsanitary place, too, is depressingly common. And Indians have of late acquired a reputation as fierce nationalists with thin skins and foul mouths. As one viral post on X put it, \"Never invade Russia in winter. Never attack India by Twitter.\"\n\nSome of the criticism is overblown. Crude men and noisy nationalists exist everywhere, but the sheer scale of the Indian contingent makes them more noticeable. Some of it is the result of India's openness. Because Indians use the same platforms and often post in English, the country's flaws are more visible than those of other countries.\n\nAnd some of it may well be cynical. Social-media algorithms prioritise content that elicits strong reactions. YouTube travel videos that portray India as filthy and dysfunctional often attract millions of views. Instagram has lately been flooded with AI-generated videos showing street-food vendors cooking in appallingly unhygienic conditions. Ragebaiting Indians can be a sound commercial strategy, as the 300m-plus views of \"Bitch Lasagna\" demonstrated.\n\nAll of which obscures just how fun and indeed funny India's internet can be. Influencers and YouTubers make material for all tastes. Social-media memes are the currency of youth slang and infiltrate the mainstream, too. This year's \"cockroach\" youth protests started life as an online joke. It is only a matter of time before India's popular culture starts breaking through more widely. Some of it already has. A dance move in a Telugu song called \"Naatu Naatu\" went viral in 2022 and later won an Oscar. Early this year an extended joke by Azeem Banatwalla, a stand-up comedian, resonated globally. As more culture crosses over, India's image online will change too.\n\nUntil then, India's reputation provides fodder for content. Mr Banatwalla's gag was a list of all the traffic violations you can commit in Mumbai for the price of a speeding fine in Norway. Somnath Padhy, another comic, has a routine riffing on how \"there are one billion websites in the world [and] I think Indians have commented on all of them.\" And Reddit has a community dedicated to \"the chaos unleashed by cheap internet\". It is called \"Jio was a mistake\".■","words":736},{"id":"as-2","title":"Dead Starlink terminals in Myanmar are getting people killed","full":"UNDER BRITISH rule, Burma boasted the largest tungsten mine in the world at Maw Chi, near the border with Thailand. Decades of war and misrule have slashed the mine's output. But labourers working in small teams at Maw Chi still dig up the metal before sending it on to Thailand and global markets to make aeroplanes, missiles and semiconductors. That has made Maw Chi a prize in the war between the military junta which seized power in Myanmar in 2021 and rebels opposing it.\n\nTwo years ago rebels captured Maw Chi and started to put its revenue stream towards their war effort. The junta responded with occasional air strikes on the mine. Rebels countered by creating an ingenious early-warning system using Starlink, the space-based internet service that is run by SpaceX. When the junta launched an attack aircraft, a spotter near the airfield would alert civilians at the mine site to take shelter. But on September 1st that warning system failed. A jet bombed the mine at Maw Chi without any alert, says a local rebel commander, killing five and injuring six. One of the Starlink terminals used for the early-warning system had been cut off, leaving the miners in the dark.\n\nStarlink has become essential in parts of Myanmar riven by conflict or governed by rebels. The junta has turned off cellular services in many of these areas, leaving rebel armies and humanitarian organisations reliant on connections to SpaceX's satellites in low-earth orbit. The democratic government-in-exile uses Starlink to remotely run schools and hospitals in liberated areas, where too large a physical footprint would attract attention from the junta's air force. In these places Starlink is ubiquitous even though, on paper, the service is not available in Myanmar. Terminals are procured elsewhere and brought into the country illegally. Until recently, SpaceX has tended to turn a benevolent blind eye towards their use.\n\nThe episode at Maw Chi was not an isolated incident. Rebels, aid workers and teachers say that some Starlink terminals across Myanmar have been shut down by SpaceX since July. Many others are still up and running, they say, and it is not clear how the company has decided which to cut off. SpaceX has not offered any public explanation, but it has told some aid workers in Myanmar that, under pressure from the American government, it is trying to cut off scam centres based in the country that rely on its services to carry out their transnational frauds. A State Department spokesman says that it is working with private firms and their financiers to combat scam centres, while \"preserving access\" for those using the technology for \"legitimate purposes\". Rumours of a \"whitelist\" maintained by the State Department have been swirling among aid groups, but no one seems to know what they need to do to be added to it.\n\nFor reasons that remain murky, SpaceX had recently throttled Starlink connections in Ukraine, reportedly after talks between Elon Musk, its founder, and President Donald Trump. Its motives in Myanmar are also obscure. Analysts have seen no signs of drones using Starlink in Myanmar, where rebels are on shoestring budgets. New terminals smuggled into Myanmar could cost as much as $8,500 each, say aid workers. That is far too pricey for the poorly funded rebels to simply strap one to a drone made to explode on impact.\n\nBut the terminals have been invaluable in letting democratic forces offer services in areas they control. Hospitals under the National Unity Government (NUG), the pro-democracy government-in-exile, use it to consult specialists abroad. And students across Myanmar use it to attend NUG schools remotely. As terminals go dead, students are dropping out. The head teacher at an NUG school says that of 270 students who started the year there, 40 have stopped attending.\n\nPerhaps the most vital use of Starlink has been in early-warning systems like the one at Maw Chi. In a curious twist, some of these systems, say former American officials, were secretly set up by USAID in 2024. Even before Mr Musk put the aid agency through the wood-chipper last year, SpaceX had doubts about this. \"They had lots of questions about the legal implications of allowing their terminals to be used in Myanmar,\" says a former American official who was involved. In particular, they say, SpaceX was wary of letting its terminals be used for lethal purposes. Shutting them down is also proving lethal. ■\n\nFor exclusive coverage of Asian politics, economics and security, sign up to Asia Bulletin, our weekly subscriber-only newsletter.","words":755},{"id":"as-3","title":"Japan prepares for its next natural disaster","full":"AMONG THE countries most prone to natural disasters, Japan has a habit of spawning new bureaucracies. Yet, despite in recent years launching agencies for digital technology and for children and families, its governments have consistently batted away a more obvious idea: to set up a disaster agency. That changed on November 2nd. At the new body's launch, Hosono Goshi, its freshly appointed minister, stood before a backdrop with a colourful logo resembling the character for \"prevent\" in bosai, or disaster prevention. He vowed to make Japan \"the world's most disaster-prepared nation\", ready for calamities \"on the scale of a national crisis\".\n\nSitting at the junction of four tectonic plates (see map), Japan suffers around a fifth of the world's earthquakes of magnitude 6 or greater. The earthquake and tsunami in 2011 in Tohoku in the north-east of the main island of Honshu, which triggered a nuclear meltdown, are strong memories. In 2024 the Noto peninsula was devastated by a magnitude 7.6 earthquake, and another powerful one struck Kumamoto this summer. Torrential rains and floods, intensified by climate change, pose a growing threat, too.\n\nYet even these calamities may be dwarfed by what lies ahead, says Kawata Yoshiaki, a disaster-management expert at Kansai University who advised the government about the agency. Seismologists warn of two catastrophic earthquakes; their statistical model suggests a 70% chance of a magnitude 7 or higher quake directly hitting the Tokyo metropolitan area in the next 30 years. Over the same period another feared megaquake along the Nankai Trough off Japan's Pacific coast has a 60-90% probability. In the worst case, such a quake could kill nearly 300,000 people, force 12.3m to evacuate and cause ¥292trn ($1.8trn) in economic losses, equivalent to more than 40% of Japan's annual GDP. Mr Kawata expects long blackouts and broken supply chains that would leave vast numbers short of food.\n\nJapan is already a global leader in disaster preparedness, especially in hardware such as earthquake-resistant buildings and early-warning systems. With the new agency, the government hopes to streamline its software and put more resources towards preparing for the bigger and more complex disasters that may lie ahead. Until now, responsibility for disaster management has been distributed across different ministries and levels of government. The prime minister oversaw such efforts with support from a small unit in the Cabinet Office, staffed by officials seconded from other ministries, who rotate out every few years. Ueshima Yasuhiro of Japan Platform, a network of aid groups, likens the government's previous approach to \"putting on a Band-Aid\" whenever disaster strikes, rather than treating underlying risks. The new agency, with around 350 staff, aims to boost preparedness by building up institutional knowledge about dealing with a range of potential disasters.\n\nCreating a single centralised body should help address one of the Japanese system's biggest weaknesses: a notoriously siloed bureaucracy that struggles to co-ordinate across institutions. Consider hospitals, says Mr Kawata, pointing out that they could lose power during a big Tokyo earthquake, putting many thousands of patients at risk; planning evacuations would involve the health ministry. The fisheries agency, meanwhile, could help fishing communities protect themselves against tsunamis. While Mr Hosono will handle day-to-day operations, Takaichi Sanae, the prime minister, will officially head the agency, which will also have powers to make suggestions to other ministries.\n\nClimate change and more extreme weather are demanding vigilance towards less familiar threats. Tokyo experienced 37 consecutive days of rain until the beginning of October this year, the longest stretch since records began in 1886. In nearby Chiba, record rains wreaked havoc in August, followed by a flood weeks later. Waki Yuichiro, a 52-year-old resident, whose house was flooded and car ruined, says he had prepared for earthquakes, \"but I never imagined flooding would affect us…In the future, we have to prepare for the unexpected—anything can happen.\" Tanaka Yasuo, a volunteer who visits Chiba to repair air-conditioners damaged by the flooding—essential appliances during Japan's sweltering summer—says that in the past he used to have time to rest between disasters; now they come so frequently that \"I can barely take a break\".\n\nJapan's demography, with its large number of old people, makes it vulnerable in other ways. One growing concern is saigai kanrenshi, or disaster-related deaths: people who survive the initial catastrophe but later die from prolonged stress or deteriorating health during evacuation. After an earthquake in Kumamoto in 2016, such deaths accounted for more than 80% of the toll. In Noto, too, they made up 70% of deaths. Poor conditions in evacuation centres, where survivors still often sleep on crowded gymnasium floors and without adequate sanitation or nutritious food, can make things worse. Such evacuation centres have hardly improved over the years. Ishiba Shigeru, a former prime minister who championed the disaster agency, blames a culture that prizes perseverance and \"idealises disaster survivors who endure hardship\". Sugano Taku of Osaka Metropolitan University points out that municipalities with inadequate resources are being left to handle them on their own; the new agency is supposed to offer them guidance and support.\n\nBut it is just one part of Japan's approach to disasters, which rests on three principles: kojo, government assistance; kyojo, mutual help; and jijo, self-
