help. In Kumamoto, Fujino Tatsuo and other volunteers clambered onto damaged roofs, removing heavy kawara, traditional Japanese tiles that could fall in another earthquake. Nearby, Miyabara Yukimi's home had collapsed, though her whole family miraculously crawled out of the rubble. She and her husband spent weeks sleeping in a lorry before volunteers helped them build a makeshift shelter. \"It feels like we lost everything—but we still have to make the first step,\" says Ms Miyabara.\n\nOn its first day the new disaster agency kicked off by issuing an \"emergency request\" urging local governments to strengthen disaster preparations and citizens to take precautions themselves. Mr Hosono stressed that jijo remained essential. \"We cannot achieve this by relying on the government alone,\" he said of his ambition to make Japan even more of an example to the rest of the world in disaster preparedness. He advised citizens to secure furniture against earthquakes and stockpile at least three days' worth of food and water—preferably, enough for a week. ■\n\nFor exclusive coverage of Asian politics, economics and security, sign up to Asia Bulletin, our weekly subscriber-only newsletter.","words":1046},{"id":"as-4","title":"The fight for the soul of the Australian right","full":"Senator pauline hanson swaggered into Secret Harbour on October 30th like a general inspecting troops in newly conquered territory. It was her first visit since One Nation, her ragtag populist party, won a by-election in the coastal town. The race for a seat in the Western Australia state parliament was the latest in an \"orange wave\" of wins for One Nation in elections this year. But Secret Harbour is special: the town sits inside the federal constituency of one of Ms Hanson's most formidable opponents, the special-forces veteran and Liberal Party frontbencher Andrew Hastie.\n\nOnce dismissed as a gadfly, Ms Hanson is now a real force. In January One Nation overtook the Liberals in the polls and still has a lead. It is neck-and-neck with the governing Labor Party. It still lacks much of the scaffolding of a national organisation, but Ms Hanson has shown that she can turn voter anger at the major parties into seats. So her party has a real shot at replacing the Liberals as the official opposition at the next election in 2028, and an outside one at forming the next government.\n\nThe election in February of Angus Taylor as the Liberals' new leader has not boosted the party's fortunes. Mr Taylor, attacked by Ms Hanson as a \"smarmy management consultant\", has mostly avoided confrontation with her. But Mr Hastie has taken her on directly. Some Liberals argue that, against her, he would be a stronger leader than Mr Taylor. \"It was obvious that the better choice would have been Hastie,\" says Malcolm Turnbull, a former prime minister and Liberal leader. \"I'm sure he'll lead the Liberal Party some day—if he doesn't lose his seat.\"\n\nThat Mr Hastie might face two such different futures is largely a consequence of one decision that he made: to testify against a fellow soldier accused of war crimes. That has led to an emotional debate on the right, one which Ms Hanson has been eager to use to her advantage. \"I was subpoenaed, and then under oath required to tell the truth,\" Mr Hastie tells The Economist. \"Would you rather me be in contempt of court and lie?\"\n\nWildly divergent answers to that question have this year been tearing the Australian right apart. Mr Hastie is now under attack from Ms Hanson and her powerful allies like Gina Rinehart, a mining magnate, and Kerry Stokes, a media baron, some of them once supporters of the Liberals. In July Ms Hanson published a video calling Mr Hastie a \"traitor\" and encouraging Liberals to abandon him. The strategy seems to be working. Tony Abbott, the president of the Liberal party and another former prime minister, has distanced himself from Mr Hastie. They are trying, he says, \"to destroy me personally\". But the stakes for the Australian right are far higher than that.\n\nThe veteran of the elite Special Air Service regiment is an unlikely hate figure for the populist right. Mr Hastie has led a push over the past year to drag the Liberal Party to the right on issues that animate populists. His call for lower net migration is now party policy. He is against women in combat. Like many populists, he bemoans the demise of Australian manufacturing, arguing for a more active industrial policy. But he parts ways with them when it comes to the rule of law.\n\nMr Hastie links his stand against war crimes to his Christianity. He testified against a fellow soldier, he tells supporters, under an oath before God. He is more open about his faith than most Australian politicians: \"I learned more about politics and leadership watching my father [a Presbyterian minister] at church than anywhere else.\" But \"I am not a Christian nationalist.\" By contrast, Ms Hanson has called Australia a Christian country, yet dodged questions about her own beliefs.\n\nThe lessons from his father's church sometimes point in unexpected directions. Mr Hastie opposes abortion and gay marriage, but rejects Ms Hanson's call for a \"monocultural\" Australia. Worse yet, in his view, are her fans' calls for racial criteria for immigrants. He recalls his father's church in Ashfield, then one of Sydney's most diverse suburbs, which held services in several Asian languages because \"everyone is made in God's image\". Immigrants, he says, should be chosen for their values and skills rather than their ethnicity.\n\nThat same philosophy has allowed Mr Hastie to make friends across the aisle. Take Senator Penny Wong, the foreign minister and a Labor stalwart. Ms Wong, gay and born in Malaysia, might seem an unlikely partner. But the two worked well together when Mr Hastie was a backbencher and Ms Wong was in opposition. \"It's always been clear to me…that he is one of the few on his side who believes there is a national interest above partisanship,\" says Ms Wong. \"While Andrew isn't really where modern Australia is, he understands that you can't out-Pauline Pauline.\"\n\nThat hints at a potential way through for Mr Hastie. Once known as the Liberal Party's rising right-winger, his fight with One Nation is broadening his appeal. He has no plans to give up his conservative bona fides, but he is seeking out new allies. Within his own party, once-critical moderate grandees like Mr Turnbull now offer cautious praise. At a fundraiser last month 80% of participants were new donors. And he has become a more frequent guest on public television and radio shows, whose viewers tend to skew centre-left. That could leave him in a stronger position to lead the Liberal Party in the future.\n\nBut first he must see off Ms Hanson's campaign to brand him among the conservative base as a traitor. He still looks to be under siege. The home-affairs minister has cited unspecified threats in advising police to upgrade security at his home and office. \"It's a bit unnerving,\" Mr Hastie says. \"But I'm a Christian. I pray about these things, and I'm at peace about it.\" ■\n\nFor exclusive coverage of Asian politics, economics and security, sign up to Asia Bulletin, our weekly subscriber-only newsletter.","words":1008}]},{"key":"Briefing","label":"Briefing","articles":[{"id":"br-1","title":"What will a lame-duck Donald Trump get up to overseas?","full":"DOUG SOSNIK, a former adviser to Bill Clinton, recalls the president's frenetic agenda during his final stretch in the White House. \"We talked about the schedule and how many more trips we could do—do you mind doing an 18-hour day?\" Mr Clinton was a man in a hurry. \"I've only got a year left in office,\" he observed. \"I've got the rest of my life to sleep.\"\n\nThe same clock now ticks for Donald Trump. He has been the defining protagonist of the past decade in American politics. But on November 3rd he became only the second term-limited president, after George W. Bush in 2006, to fight his final midterm election in control of both chambers of Congress and to lose both, shocking Mr Trump himself. \"Wow,\" he told the New York Times upon learning of his party's loss in South Carolina, a former MAGA stronghold. \"That's amazing.\"\n\nIn his final two years in office, Mr Trump will be embattled at home as he confronts his political mortality. Congress, which Mr Trump had rendered largely irrelevant while under Republican control, will swamp his administration with hearings and subpoenas on corruption and abuse of power. (\"Lawyer up,\" one congressman advised on X.) It will dare him to veto popular policies such as restoring health-care funding. Democrats will try to stop his vanity pursuits in the capital, too: his grand ballroom and his triumphal arch. But the area where he will continue to have the greatest, most unrestrained impact is overseas, where he will turn for monsters to slay and legacies to leave.\n\nMr Trump's foreign policy—from Venezuela to Greenland to Iran—has been radical and hyperactive. Now it could become more so. Mr Trump has unfinished business in Iran and Cuba that could drag America deeper into the Middle East and Latin America. His flirtation with great-power carve-ups, including summitry with Vladimir Putin and Xi Jinping, could herald a darker world order—and difficulties for Ukraine. His quixotic courtship of Kim Jong Un, North Korea's leader, could upturn American nuclear policy. All this will unfold as AI wizardry spirals towards artificial general intelligence, throwing up diplomatic and national-security challenges that will fall to Mr Trump to manage.\n\nAll this would be concerning enough for the world under a president who had a gift for diplomacy, a Herculean work ethic and a normal attention span. Mr Trump not only will have to do without those qualities, but he will also probably lose experienced staff who could help in a crisis—another feature of lame-duck periods. The president's adventures abroad over the next two years promise to be chaotic and unpredictable, if not necessarily fruitful.\n\nMr Trump will not be unique in searching for solace abroad as the end comes into sight. The Economist has analysed presidential travel records going back to Harry Truman. They show that presidents are typically much more active overseas in the last two years of their second terms (see chart). Mr Bush spent 50 days abroad in 2008, twice his previous annual average. After losing the 2006 midterms, he ordered a surge of military forces in Iraq against bitter opposition in Congress in the hope of salvaging a war that had gone badly awry. Barack Obama doubled his travel between the final two years of his first and second terms. His sweeping nuclear deal with Iran came the year after his own bruising in the 2014 midterms. \"Presidents by the end of their term are frustrated with the various constraints on them,\" says Yuval Levin of the American Enterprise Institute, a think-tank, who served in the Bush administration. \"And foreign policy is where there are fewest constraints.\"\n\nMr Trump, like an impresario who changes the act when the audience grows weary, is drawn to foreign-policy manoeuvres that confound his critics and, in his mind, demonstrate his strength. Mr Trump has long boasted of his diplomatic prowess, famously claiming that he would end the Ukraine war in a day—and, at a midterms rally on November 1st, that he would have won the Vietnam war in a week. Mr Trump's evident failure to win the war at hand, with Iran, therefore rankles with him. The two sides continue to skirmish, with America conducting what it described as \"defensive\" air strikes on November 2nd.\n\nUntil recently Mr Trump was leaning towards his third attack on Iran in 18 months (see map), in concert with Israel, to force it to fully reopen the Strait of Hormuz and limit its nuclear programme. That would trigger Iranian retaliation against Gulf energy facilities, consuming Mr Trump's attention for months to come. On October 28th Chris Murphy, a Democratic senator, said that he had received an intelligence briefing on America's war plans. \"I will just say this—their plan is insane,\" said Mr Murphy, noting that public reporting had pointed to the targeting of civilian infrastructure. \"It will lead to devastating escalation and the likely destruction of our commitment to the rule of law.\" (Three days later Mr Murphy went to hospital after suffering a stroke.) A person familiar with the planning says that Mr Trump was considering whether to strike Iranian oil tankers in Asia.\n\nIn recent days other sources say that Mr Trump has put these plans on ice, telling Binyamin Netanyahu, Israel's prime minister, that America will not back an Israeli attack. Israeli forces, which were ready for a strike, have paused their preparations.\n\nMr Trump will face opposition to fresh strikes from multiple sources. One is J.D. Vance, his vice-president—and a probable candidate for president in 2028—who, in a post on X on November 4th, explicitly blamed the midterms drubbing on the war and said voters wanted a different relationship with Israel. Another is Congress. Such is the scale of the blue wave and so detested is the war—on a par with the Vietnam war—that Democrats might withhold funding (and risk being accused of undermining the troops in the field). Even if Mr Trump chooses to escalate, America is unlikely to have the munitions, air-defence interceptors or political stomach for another protracted campaign. Mr Trump's aim is presumably to secure a deal that allows him to emerge from the fracas with the appearance of an honourable peace. Iran's leadership, conscious of Mr Trump's political frailty, is unlikely to fold easily.\n\nIf Iran is the first test of Mr Trump's diplomatic agenda, Ukraine is likely to be the second. Here the president's vengeful instincts present dangers. Mr Trump has repeatedly blamed Ukraine for the war, criticised the country's strikes on Russian oil refineries and belittled Volodymyr Zelensky, its president. So far American intelligence-sharing with Ukraine and arms sales via Europe have survived. When American negotiators unveiled a half-baked 28-point peace plan, in November 2025, Mr Trump's secretary of state, Marco Rubio, and European allies intervened to prune its worst parts. At each juncture, Mr Trump has stepped back from the breach of a complete abandonment of Ukraine and a definitive turn towards Russia.\n\nMr Trump may direct his ire once again at Mr Zelensky, should he conclude—wrongly—that Ukraine's strikes on Russian refineries were primarily responsible for the fuel-price shock that helped doom Republicans at the polls. In 2020 Mr Trump responded furiously after believing that China had misled him over the spread of covid-19. A similar sense of betrayal could translate into a more aggressive pressure campaign against Mr Zelensky personally and Ukraine as a whole, with the aim of forcing Ukraine's capitulation.\n\nAn early glimpse of Mr Trump's post-midterms mood may come on November 18th-19th, when he and Mr Putin visit Shenzhen, China, for an international summit hosted by Mr Xi. America's European allies fret that Ukraine will be on the menu. In recent months, Mr Trump has made concession after concession to Russia, cutting a deal to buy diesel and waiving sanctions in return for the release of an American prisoner, in part to lure Mr Putin to the negotiating table. Mr Putin may conclude that he will never again enjoy as pliant a partner as Mr Trump. But the Russian leader also believes that time is on his side, and that European support for Ukraine will ebb away. What is more, Democrats in Congress can be expected to hinder or block efforts by Mr Trump to give Mr Putin more ground on Ukraine—especially any deal that reeks of corruption.\n\nThe president may quickly lose interest (not for the first time) in the quagmire of Ukraine and turn his attention to another developing hot spot in his own hemisphere: Cuba. Since taking office, Mr Trump has squeezed Cuba's dictatorship economically, causing power cuts, food shortages and a collapse of health care on the island. In January 2026 the president decapitated Venezuela's government by abducting Nicolás Maduro, its leader. He is thought to be tempted by a similar model of light-touch regime change in Cuba.\n\nAmerica's economic warfare is intended both to weaken the regime and split the country's elite, potentially throwing up partners who might work with America, much as Delcy Rodríguez, Venezuela's acting leader, abandoned Mr Maduro. Mr Trump has made little secret of his goal. \"We'll take ​care of Cuba on our way back from Iran,\" he boasted on the campaign trail in October. That month Mr Rubio, a Cuban-American hawk, urged disaffected Cubans to work with the CIA: \"To those who seek to ​create positive change in Cuba—now is the time.\"\n\nMr Trump longs to be a president who achieves what his predecessors did not. He would relish being the leader who reversed the Cuban communist victory of 1959. But he is not a man for details. In Venezuela he has largely left the country's dictatorship in place, swapping its leaders and cutting grubby deals to secure its oil for American firms. A fudge like that would be far harder to pull off in Cuba, notes a person with knowledge of the administration's debates, because Cuba's diaspora—which is older and more established than Venezuela's—would make its wrath felt.\n\nIt would arguably help Mr Trump's chances of success in his foreign-policy endeavours if he had experienced staffers around him. But an exodus may be under way. Mr Rubio, who also serves as national security adviser, has quietly been exploring jobs in the private sector. (He may skip the 2028 presidential race, hoping for more favourable conditions in 2032.) Mr Rubio's departure would shift the balance of the administration, potentially leaving John Ratcliffe, the director of the CIA, as the most influential hawk in the cabinet.\n\nThe president may also lose his favourite man at the Pentagon. Many Democrats want to impeach Pete Hegseth, the pugnacious and divisive secretary of war. Hakeem Jeffries, the likely Democratic Speaker of the House, has not ruled it out.\n\nDemocrats may demand Mr Hegseth's ousting as the price of passing an $87.6bn supplemental bill including $67bn for the Department of War, which is in a deep financial hole. Presidents often seek scapegoats after an electoral pummelling. Mr Bush dumped Donald Rumsfeld, his defence secretary, after his midterm loss in 2006; Mr Trump sacked Jeff Sessions, his then attorney-general, after his party's defeat in the House in 2018.\n\nYet Mr Trump is more likely to respond with defiance than with contrition. There is speculation that Mr Hegseth could be shunted into the job of national security adviser or possibly appointed to the Senate seat for Tennessee that is to be vacated in January by Marsha Blackburn, who has been elected the state's governor. There, some note, he would enjoy a degree of protection from Democratic probes—including those into his deadly strikes on boats thought to be carrying drugs.\n\nEven if Mr Hegseth survives, Mr Trump's coterie of advisers has already begun to thin out. The national security council has been largely gutted, resulting in ad hoc and haphazard decision-making. Experts have been fired en masse, resulting in poor preparation for meetings and negotiations. Policy can swing on the whim of individuals or small groups, as Elon Musk, the founder of SpaceX and a former adviser to Mr Trump, showed when his firm appeared to cut off vital satellite communications to Ukraine during a row in October. Some of Mr Trump's envoys, both official and unofficial, blend diplomacy with the pursuit of lucrative business deals.\n\nMr Trump will also find it ever harder to gain the Senate's assent for new cabinet secretaries and other appointees, leaving officials in acting roles for long stretches. Susie Wiles, the president's chief of staff, who is widely viewed as a stabilising force in the White House, may depart after serving for longer than any of Mr Trump's first-term consiglieri. The ultra-nationalist agenda pushed by Stephen Miller, Ms Wiles's deputy, has proved to be an electoral liability. The quality of staff tends to fall during an administration, observes Mr Sosnik: \"You see a thinning of the herd, with the people coming in…generally a peg or two below the people that they replace.\"\n\nThat leaves an increasingly isolated, embattled Mr Trump looking for ways to shore up his legacy in the only way he knows: entirely ad hoc. It is not unusual for lame-duck presidents to roam the globe in search of lasting achievements in their final days. But history shows it is hard going.\n\nWoodrow Wilson spent six months at the Paris Peace Conference in 1919 and returned to sell the League of Nations to the American public—an effort that failed spectacularly when the Senate spurned the treaty. Dwight Eisenhower's superpower summit with the Soviet Union fell apart after a U2 spy plane was shot down. In 1968, after he decided not to seek re-election, Lyndon Johnson tried to secure a settlement of the Vietnam war, to no avail. In his last year in office Mr Clinton came close to visiting Pyongyang and tried, but failed, to forge a lasting peace deal between Israel and the Palestine Liberation Organisation.\n\nSome have fared better. Richard Nixon and Ronald Reagan signed major arms-control agreements in their final years (as did Johnson). Mr Obama normalised ties with Cuba and painstakingly negotiated the Iran nuclear deal (scuttled by Mr Trump). And Mr Trump himself, in the last part of his first term, went on a foreign-policy blitz, meeting Mr Kim three times, signing a peace deal with the Taliban and brokering the Abraham accords which normalised relations between Israel and several Gulf Arab and north African states.\n\nA lame-duck Mr Trump does not seem well-positioned to strike lasting, historic deals. But he will try. He wants to meet Mr Kim yet again to pick up where he left off in his first term. He is keen on a three-way meeting with Mr Putin and Mr Xi at the summit in Shenzhen. That is ostensibly also to discuss nuclear arms control (a topic China has no interest in broaching while its arsenal is below parity with America and Russia). Eventually he may again try to broker a peace in Ukraine.\n\nThe prospects for substantive diplomacy seem bleak. The risk is that Mr Trump agrees to shoddy deals that serve as sticking plasters, allowing him to claim he is worthy of a peace prize. (Mr Vance too may encourage such pacts to promote his own peacemaking bona fides to future voters.) That could store up serious problems for Mr Trump's successor, just as happened in 2020: Mr Trump's pact with the Taliban contributed to the collapse of the Afghan government and Joe Biden's chaotic withdrawal the following year.\n\nMr Trump's lame-duck status will also make it harder for him to strike lasting deals in the first place. Friends and foes will adjust how they interact with the president, notes Sam Charap of the RAND Corporation, a think-tank, mindful that his political authority will ebb away. The extent of Democratic gains on November 3rd suggests that the party is in a strong position to win the presidency in 2028. Many late-term deals, such as Mr Obama's nuclear agreement with Iran and opening to Cuba, rest on weak legislative footing and are easily undone by successors. Ukraine, in particular, might try to wait out Mr Trump in the hope of a successor, in 2029, who would look more favourably on the country. Indeed, it will now be hard for Republicans to recapture the Senate—which must approve international treaties—until 2032, beyond Mr Trump's tenure.\n\nIt is possible that Mr Trump's fundamental unseriousness will work in the world's favour. It takes work to achieve diplomatic breakthroughs. Mr Trump's lack of follow-through might end up leaving a status quo world to the next president. Perhaps he will be drawn more to his domestic preoccupations: carving his name into Washington's granite, securing his family's post-presidency business interests and doling out pardons. But it is also possible that his impetuous nature will put the world at risk in a crisis, a black swan that tests a president's wisdom and patience. Consider an AI-enabled cyber crisis or a Chinese blockade of Taiwan, or something worse. For two years, the world will be holding its breath.■","words":2826}]}],"featured":{"id":"eco-1","title":"Donald Trump's humiliation offers America an opportunity","intro":"America just handed Donald Trump its biggest political defeat in half a century — and a second chance to both parties.","cartoon":"vendor/cartoon-trump.jpg"},"vocab":{"title":"Leaders · 语言要点","text":"# Leaders · 语言要点\n\n> 按表达类型分类 · 每个表达配英语解释 + 原文例句 · 来自本期五篇社论\n\n## 一、习语 & 惯用语 (Idioms)\n\n**take for granted** — to assume something will always be there and never stop to appreciate it\n> Voters cannot be taken for granted.\n\n**end up in very deep water** — to find yourself in serious trouble\n> Politicians who ignore them risk ending up in very deep water.\n\n**wrought havoc** — caused great damage or destruction\n> Gangs brandishing military-grade weapons have wrought havoc.\n\n**no-man's land** — a situation where you belong to neither side; an uncertain position\n> Some are stuck in a no-man's land: unable to access American tech, but also scared of using Chinese alternatives.\n\n**friendly fire** — harm caused by your own side rather than the enemy\n> When AI is used benignly it creates a friendly-fire problem.\n\n**take matters into one's own hands** — to deal with a problem yourself instead of waiting for others\n> No wonder patients are taking matters into their own hands.\n\n**out of pocket** — paid with your own money, not covered by insurance\n> Nearly all consumer health care is paid for out of pocket.\n\n**pearl-clutchers** — people who are easily shocked or offended (moralisers)\n> Britain has become too willing to ban anything pearl-clutchers dislike.\n\n**fall behind the curve** — to be slower than others at adopting new developments\n> Organisations that are not yet using AI constantly to find and close security holes have fallen behind the curve.\n\n## 二、短语动词 (Phrasal Verbs)\n\n**rile up** — to make someone angry or agitated\n> Both parties need a way of doing politics that spends less time riling up their constituents.\n\n**spell out** — to explain clearly and in detail\n> He should spell out his intentions.\n\n**toss aside** — to discard or abandon something carelessly\n> By tossing aside the rulebook, he made his country safer.\n\n**wring (sth) from** — to obtain something from someone with difficulty or effort\n> He and his cronies may try to wring what more they can from their time in power.\n\n**phase out** — to gradually stop using or producing something\n> (同类表达，本期语境相近)\n\n## 三、固定搭配 (Collocations)\n\n**wave-election** — an election in which one party wins by a huge margin\n> This was the biggest wave-election since the aftermath of Watergate.\n\n**burnish one's reputation** — to improve or polish one's image\n> He wants to burnish his reputation, by showing that his record of suppressing gangs can be extended abroad.\n\n**riddled with** — full of (something bad)\n> The result is markets riddled with inefficiency.\n\n**a tangle of** — a complicated mess of\n> Their true cost is obscured by a tangle of middlemen and insurers.\n\n**the erosion of** — the gradual weakening of\n> Most profound of all is the erosion of the original source of market power.\n\n**a verdict on** — a judgment about\n> The vote was thus a verdict on the president.\n\n**turbocharge (sth)** — to make something much more powerful or faster\n> Artificial intelligence has turbocharged cyber malfeasance.\n\n**a sobering (fact/reminder)** — a fact that makes you feel serious and concerned\n> These events have been sobering for the many commentators.\n\n## 四、常用句式 (Sentence Patterns)\n\n**Already it is clear this was not X, but Y** — used to state a surprising contrast\n> Already it is clear this was not a normal midterm swing, but the biggest wave-election in 50 years.\n\n**It turns out that…** — used to introduce a discovery that differs from what was expected\n> It turns out that voters do not much like a president who is elected on a promise to lower prices, but then launches a tariff crusade.\n\n**Things are so bad that it is tempting to…** — used to say a situation is so dire that almost any solution seems welcome\n> Things are so bad that it is tempting to welcome almost any determined outsider.\n\n**No wonder…** — it is not surprising that…\n> No wonder patients are taking matters into their own hands.\n\n**It is easier to start a fight than to end one** — starting trouble is easy, ending it is hard\n> He should remember that it is easier to start a fight than to end one.\n\n**X should be rare, narrow and clearly defined** — restrictions should be limited in scope and precisely specified\n> Restrictions on free speech should be rare, narrow and clearly defined.\n\n**Bans make moralists feel good, but will not work as planned** — prohibitions satisfy moralisers, but fail in practice\n> Bans make moralists feel good, but will not work as planned."},"light":{"id":"cn-1","title":"Hit podcasts reveal the angst of China's youth","blurb":"China's young people turn to long-form podcasts to voice anxieties they cannot express elsewhere.","cartoon":"vendor/cartoon-podcasts.jpg"}}
</script>

<script>
(function(){
  "use strict";

  var KEY_ARTICLES = "flip.articles.v1";
  var KEY_SETTINGS = "flip.settings.v1";
  var KEY_VOCAB = "flip.vocab.v1";
  var KEY_TAKEAWAYS = "flip.takeaways.v1";
  var PDFJS_VERSION = "3.11.174";
  var WPM = 220; // 英文阅读速度（词/分钟）

  var state = {
    articles: load(KEY_ARTICLES, []),
    settings: load(KEY_SETTINGS, { fontSize:17, serif:false, dark:false }),
    vocab: load(KEY_VOCAB, []),
    takeaways: load(KEY_TAKEAWAYS, []),
    filter: "all",
    query: "",
    currentId: null,
    scrollT: null,
    selT: null,
    lastSelText: "",
    savedRange: null,
    dictCn: null,
    dictCnPromise: null
  };

  /* ================= storage ================= */
  var storageOk = (function(){
    try { var k = "__flip_test__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();
  var storageWarned = false;
  function load(key, def){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
  }
  function save(){
    try{ localStorage.setItem(KEY_ARTICLES, JSON.stringify(state.articles)); }
    catch(e){
      if(!storageWarned){ storageWarned = true; toast("无法保存到本地（可能是无痕模式），文章只在本次打开时有效"); }
    }
  }
  function saveSettings(){
    try{ localStorage.setItem(KEY_SETTINGS, JSON.stringify(state.settings)); }
    catch(e){}
  }
  function saveVocab(){
    try{ localStorage.setItem(KEY_VOCAB, JSON.stringify(state.vocab)); }
    catch(e){}
  }
  function saveTakeaways(){
    try{ localStorage.setItem(KEY_TAKEAWAYS, JSON.stringify(state.takeaways)); }
    catch(e){}
  }
  function injectBuiltin(){
    var FLAG = "flip.builtin.v1", VER = "v5-wordcount";
    // 版本号用原始字符串读，不能走 load()（load 会 JSON.parse，而这里存的是裸字符串）
    var cur = null;
    try { cur = localStorage.getItem(FLAG); } catch(e){}
    // featured / light / expressions 每次都要重建，不能依赖 localStorage
    var el = document.getElementById("builtinData");
    var data = {};
    if(el){ try { data = JSON.parse(el.textContent || "{}"); } catch(e){ data = {}; } }
    state.featured = data.featured || null;
    state.light = data.light || null;
    state.expressions = parseExpressions(data.vocab ? data.vocab.text : "");
    if(cur === VER) return;
    // 保存旧文章的划线（bodyHtml 含 data-hl 标记），重新注入后恢复
    var oldBody = {};
    state.articles.forEach(function(a){
      if(a.bodyHtml && a.bodyHtml.indexOf('data-hl') !== -1) oldBody[a.id] = a.bodyHtml;
    });
    // 清理旧的内置文章（含旧版 eco/cn/as/br 和中文精读）
    state.articles = state.articles.filter(function(a){
      return !/^(builtin-leaders|builtin-vocab|eco-|cn-|as-|br-)/.test(a.id);
    });
    // 注入语言要点（先 unshift，最终排最后）
    if(data.vocab && !state.articles.some(function(x){ return x.id === "builtin-vocab"; })){
      state.articles.unshift({
        id: "builtin-vocab", title: data.vocab.title, source: "语言要点",
        text: data.vocab.text, createdAt: Date.now(), lastReadAt: null,
        progress: 0, finished: false, words: wordCount(data.vocab.text), group: "vocab"
      });
    }
    // 注入各板块文章（逆序 unshift，让 Leaders 排最前、每板块话题强的排前）
    var sections = data.sections || [];
    for(var si = sections.length - 1; si >= 0; si--){
      var sec = sections[si];
      var arts = sec.articles || [];
      for(var ai = arts.length - 1; ai >= 0; ai--){
        var a = arts[ai];
        if(!state.articles.some(function(x){ return x.id === a.id; })){
          var body = cleanArticleText(a.full);
          var art = {
            id: a.id, title: a.title, source: "经济学人 · " + sec.label,
            text: body, createdAt: Date.now(), lastReadAt: null,
            progress: 0, finished: false, words: wordCount(body),
            group: "economist", section: sec.label, order: ai
          };
          if(oldBody[a.id]) art.bodyHtml = oldBody[a.id];
          state.articles.unshift(art);
        }
      }
    }
    save();
    try{ localStorage.setItem(FLAG, VER); }catch(e){}
  }

  /* ================= dom ================= */
  var $ = function(id){ return document.getElementById(id); };

  /* ================= helpers ================= */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmtNum(n){ return n.toLocaleString("en-US"); }
  function fmtDate(ts){
    var d = new Date(ts);
    var p = function(x){ return (x<10?"0":"")+x; };
    return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate());
  }
  function wordCount(t){
    return (t.trim().split(/\s+/).filter(function(w){ return /[A-Za-z0-9]/.test(w); })).length;
  }
  function cleanArticleText(t){
    // 去掉经济学人正文末尾的订阅 / 简报推广行（不属于正文，会虚增词数）
    var s = String(t || "");
    s = s.replace(/(?:Subscribers can sign up to[^\n]*|For exclusive coverage of[^\n]*)\s*$/i, "");
    return s.replace(/[\n ]+$/, "").trim();
  }

  var toastT;
  function toast(msg, dur){
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("show"); }, dur || 2200);
  }

  function statusOf(a){
    if(a.finished) return "done";
    if(a.progress && a.progress > 0) return "reading";
    return "unread";
  }

  /* ================= import ================= */
  function addArticle(title, text, source){
    var a = {
      id: uid(), title: title || "未命名文章", source: source || "",
      text: text, createdAt: Date.now(), lastReadAt: null,
      progress: 0, finished: false, words: wordCount(text)
    };
    state.articles.unshift(a);
    save();
    return a;
  }

  function titleFromFilename(name){
    return name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();
  }
  function titleFromText(text){
    var first = text.replace(/^\s+/,"").split(/\r?\n/)[0];
    if(first){
      first = first.replace(/^#{1,6}\s+/, "").replace(/\s+#+\s*$/,"").trim();
      if(first.length > 0 && first.length <= 120) return first;
    }
    return null;
  }
  function cleanText(text){
    // 规范化：CRLF、多余空白、页脚页码噪声
    return text.replace(/\r\n?/g,"\n").replace(/\u00a0/g," ").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  }

  function normalizePdfText(text){
    var lines = text.split(/\n/).map(function(l){return l.trim();}).filter(function(l){return l.length;});
    var paras = [], cur = "";
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(cur === ""){ cur = line; continue; }
      if(/[.!?]["”’]?$/.test(cur) || line.length < 60 && /[A-Z]/.test(line[0])){
        paras.push(cur); cur = line;
      } else {
        cur += " " + line;
      }
    }
    if(cur) paras.push(cur);
    return paras.join("\n\n");
  }

  function importFiles(files){
    var list = Array.prototype.slice.call(files);
    if(!list.length) return;
    var pending = list.length;
    var added = 0;
    var errors = [];

    function finish(){
      if(pending > 0) return;
      render();
      if(added > 0){
        toast("导入完成，新增 " + added + " 篇");
      } else if(errors.length){
        toast("导入失败：" + errors.join(" · "), 9000);
      }
    }

    list.forEach(function(file){
      var ext = (file.name.split(".").pop()||"").toLowerCase();
      var isMd = ext === "md" || ext === "markdown";
      var isTxt = ext === "txt" || ext === "text" || file.type === "text/plain";
      var isPdf = ext === "pdf" || file.type === "application/pdf";
      var isEpub = ext === "epub" || file.type === "application/epub+zip";

      if(isPdf){
        readPdf(file).then(function(text){
          var clean = normalizePdfText(text);
          if(!clean.trim()){
            errors.push(file.name + " 无文字层（扫描版/图片版）");
          } else {
            var title = titleFromText(clean) || titleFromFilename(file.name);
            addArticle(title, clean, file.name);
            added++;
          }
          pending--; finish();
        }).catch(function(e){
          errors.push(file.name + "（" + (e && e.message ? e.message : "解析失败") + "）");
          pending--; finish();
        });
      } else if(isEpub){
        readEpub(file).then(function(result){
          addArticle(result.title || titleFromFilename(file.name), result.text, file.name);
          added++;
          pending--; finish();
        }).catch(function(e){
          errors.push(file.name + "（" + (e && e.message ? e.message : "EPUB 解析失败") + "）");
          pending--; finish();
        });
      } else if(isTxt || isMd){
        file.text().then(function(text){
          var t = cleanText(text);
          if(!t.trim()){
            errors.push(file.name + " 是空文件");
          } else {
            var title = isMd ? (titleFromText(t) || titleFromFilename(file.name)) : titleFromFilename(file.name);
            addArticle(title, t, file.name);
            added++;
          }
          pending--; finish();
        }).catch(function(e){
          errors.push(file.name + "（读取失败）");
          pending--; finish();
        });
      } else {
        errors.push(file.name + " 格式不支持");
        pending--; finish();
      }
    });
  }

  /* ---------- PDF.js 动态加载：本地优先，CDN 兜底 ---------- */
  var pdfjsPromise = null;
  function loadPdfjs(){
    if(pdfjsPromise) return pdfjsPromise;
    pdfjsPromise = doLoadPdfjs().catch(function(e){
      pdfjsPromise = null; // 失败后可重试
      throw e;
    });
    return pdfjsPromise;
  }
  function doLoadPdfjs(){
    var candidates = [
      { lib: "vendor/pdf.min.js", worker: "vendor/pdf.worker.min.js" },
      { lib: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.min.js",
        worker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.worker.min.js" },
      { lib: "https://unpkg.com/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.min.js",
        worker: "https://unpkg.com/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.worker.min.js" },
      { lib: "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.min.js",
        worker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.worker.min.js" }
    ];
    function tryLoad(i){
      if(i >= candidates.length) return Promise.reject(new Error("PDF 解析器加载失败"));
      var c = candidates[i];
      return loadScript(c.lib, 15000).then(function(){
        var lib = window["pdfjs-dist/build/pdf"] || window.pdfjsLib;
        if(!lib) return tryLoad(i + 1);
        try { lib.GlobalWorkerOptions.workerSrc = c.worker; } catch(e){}
        return lib;
      }).catch(function(){ return tryLoad(i + 1); });
    }
    return tryLoad(0);
  }
  function loadScript(src, timeout){
    return new Promise(function(resolve, reject){
      var done = false, s = document.createElement("script");
      var timer = setTimeout(function(){
        if(!done){ done = true; s.onload = s.onerror = null; reject(new Error("timeout")); }
      }, timeout || 15000);
      s.onload = function(){ if(!done){ done = true; clearTimeout(timer); resolve(); } };
      s.onerror = function(){ if(!done){ done = true; clearTimeout(timer); reject(new Error("load fail")); } };
      s.src = src;
      document.head.appendChild(s);
    });
  }
  function readPdf(file){
    toast("正在加载 PDF 解析器 …", 6000);
    return loadPdfjs().then(function(lib){
      return file.arrayBuffer().then(function(buf){
        return lib.getDocument({ data: buf }).promise;
      }).then(function(pdf){
        toast("正在解析 PDF（共 " + pdf.numPages + " 页）…", 60000);
        var jobs = [];
        for(var i=1;i<=pdf.numPages;i++){
          (function(n){
            jobs.push(
              pdf.getPage(n).then(function(pg){
                return pg.getTextContent().then(function(tc){
                  return tc.items.map(function(it){ return it.str; }).join(" ");
                });
              })
            );
          })(i);
        }
        return Promise.all(jobs).then(function(arr){ return arr.join("\n\n"); });
      });
    });
  }

  /* ---------- JSZip 动态加载（解压 epub）：本地优先，CDN 兜底 ---------- */
  var jszipPromise = null;
  function loadJszip(){
    if(jszipPromise) return jszipPromise;
    jszipPromise = (function(){
      var candidates = [
        "vendor/jszip.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
        "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js",
        "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
      ];
      function tryLoad(i){
        if(i >= candidates.length) return Promise.reject(new Error("EPUB 解析器加载失败"));
        return loadScript(candidates[i], 15000).then(function(){
          return window.JSZip ? window.JSZip : tryLoad(i + 1);
        }).catch(function(){ return tryLoad(i + 1); });
      }
      return tryLoad(0);
    })().catch(function(e){ jszipPromise = null; throw e; });
    return jszipPromise;
  }

  function resolvePath(base, href){
    var h = href || "";
    h = h.split("#")[0];
    try { h = decodeURIComponent(h); } catch(e){}
    var parts = ((base || "") + h).split("/");
    var out = [];
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      if(p === "" || p === ".") continue;
      if(p === ".."){ if(out.length) out.pop(); continue; }
      out.push(p);
    }
    return out.join("/");
  }

  function stripHtml(html){
    var s = String(html || "");
    s = s.replace(/<script[\s\S]*?<\/script>/gi, " ");
    s = s.replace(/<style[\s\S]*?<\/style>/gi, " ");
    s = s.replace(/<(\/?(?:p|div|h[1-6]|li|blockquote|section|article|tr|table|figure|figcaption)[^>]*)>/gi, "\n");
    s = s.replace(/<br\s*\/?>/gi, "\n");
    s = s.replace(/<hr\s*\/?>/gi, "\n\n");
    s = s.replace(/<[^>]+>/g, "");
    s = s.replace(/&nbsp;/gi, " ");
    s = s.replace(/&amp;/gi, "&");
    s = s.replace(/&lt;/gi, "<");
    s = s.replace(/&gt;/gi, ">");
    s = s.replace(/&quot;/gi, '"');
    s = s.replace(/&apos;|&#39;/gi, "'");
    s = s.replace(/&#(\d+);/g, function(_, n){ return String.fromCharCode(parseInt(n, 10)); });
    s = s.replace(/&#x([0-9a-fA-F]+);/g, function(_, n){ return String.fromCharCode(parseInt(n, 16)); });
    s = s.replace(/[ \t]+/g, " ");
    s = s.replace(/\n[ \t]*\n[ \t]*\n+/g, "\n\n");
    s = s.replace(/^[ \n]+|[ \n]+$/g, "");
    return s;
  }

  function readEpub(file){
    toast("正在解析 EPUB …", 60000);
    return loadJszip().then(function(JSZip){
      return file.arrayBuffer().then(function(buf){
        return JSZip.loadAsync(buf);
      }).then(function(zip){
        var container = zip.file("META-INF/container.xml");
        if(!container) throw new Error("不是有效的 EPUB（缺 container.xml）");
        return container.async("string").then(function(cxml){
          var m = cxml.match(/full-path="([^"]+)"/);
          if(!m) throw new Error("EPUB 缺 content.opf");
          var opfPath = m[1];
          var baseDir = opfPath.split("/").slice(0, -1).join("/");
          if(baseDir) baseDir += "/";
          var opfFile = zip.file(opfPath);
          if(!opfFile) throw new Error("找不到 " + opfPath);
          return opfFile.async("string").then(function(opf){
            return parseEpub(opf, baseDir, zip);
          });
        });
      });
    });
  }

  function parseEpub(opf, baseDir, zip){
    var title = "未命名";
    var tm = opf.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);
    if(tm) title = stripHtml(tm[1]) || "未命名";

    var manifest = {};
    var itemRe = /<item\b[^>]*>/gi, m;
    while((m = itemRe.exec(opf))){
      var id = (m[0].match(/\bid="([^"]+)"/) || [])[1];
      var href = (m[0].match(/\bhref="([^"]+)"/) || [])[1];
      if(id && href) manifest[id] = href;
    }

    var spine = [];
    var refRe = /<itemref\b[^>]*idref="([^"]+)"/gi, r;
    while((r = refRe.exec(opf))) spine.push(r[1]);

    var jobs = spine.map(function(id){
      var href = manifest[id];
      if(!href) return Promise.resolve("");
      var full = resolvePath(baseDir, href);
      var f = zip.file(full);
      if(!f) return Promise.resolve("");
      return f.async("string").then(stripHtml).catch(function(){ return ""; });
    });

    return Promise.all(jobs).then(function(parts){
      var text = parts.filter(function(p){ return p && p.trim(); }).join("\n\n");
      if(!text.trim()) throw new Error("EPUB 里没提取到正文");
      return { title: title, text: text };
    });
  }

  /* ================= markdown-lite → HTML ================= */
  function inline(s){
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    return s;
  }
  function renderText(text){
    var lines = text.replace(/\r\n?/g,"\n").split("\n");
    var html = "", open = null;
    function closeList(){ if(open){ html += (open==="ul"?"</ul>":"</ol>"); open = null; } }
    function cells(line){ return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){ return c.trim(); }); }
    function isSep(line){ var s = line.trim(); return /^\|?[\s:|-]+\|?$/.test(s) && s.indexOf("-") !== -1; }
    for(var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+$/,"");
      if(!line.trim()){ closeList(); continue; }

      // Markdown 表格
      if(/^\s*\|/.test(line) && isSep(lines[i+1] || "")){
        var rows = [], j = i;
        while(j < lines.length && /^\s*\|/.test(lines[j])){ rows.push(cells(lines[j])); j++; }
        if(rows.length >= 2){
          closeList();
          html += "<table><thead><tr>" + rows[0].map(function(c){ return "<th>"+inline(c)+"</th>"; }).join("") + "</tr></thead><tbody>";
          for(var k=2;k<rows.length;k++){
            html += "<tr>" + rows[k].map(function(c){ return "<td>"+inline(c)+"</td>"; }).join("") + "</tr>";
          }
          html += "</tbody></table>";
          i = j - 1;
          continue;
        }
      }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if(h){ closeList(); html += "<h"+(h[1].length+1)+">"+inline(h[2])+"</h"+(h[1].length+1)+">"; continue; }
      var q = line.match(/^>\s?(.*)$/);
      if(q){ closeList(); html += "<blockquote>"+inline(q[1])+"</blockquote>"; continue; }
      var ul = line.match(/^\s*[-*•]\s+(.*)$/);
      if(ul){ if(open!=="ul"){ closeList(); html+="<ul>"; open="ul"; } html += "<li>"+inline(ul[1])+"</li>"; continue; }
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if(ol){ if(open!=="ol"){ closeList(); html+="<ol>"; open="ol"; } html += "<li>"+inline(ol[1])+"</li>"; continue; }
      closeList(); html += "<p>"+inline(line)+"</p>";
    }
    closeList();
    return html;
  }

  function cloze(sentence, word){
    if(!sentence || !word) return sentence;
    var idx = sentence.toLowerCase().indexOf(word.toLowerCase());
    if(idx === -1) return sentence;
    return sentence.slice(0, idx) + "＿＿＿" + sentence.slice(idx + word.length);
  }
  function makeHint(word){
    return word.split(/\s+/).map(function(w){
      return w.charAt(0) + w.slice(1).replace(/[A-Za-z]/g, "＿");
    }).join(" ");
  }
  function renderHook(){
    var el = $("hookBody");
    if(!el) return;
    var words = state.vocab.slice(0, 3);
    if(!words.length){
      el.innerHTML = '<div class="hook-empty">读文章时选中不认识的词，点「划线」收藏，这里会自动生成「原文挖空」——回到原文句子，在空格里填出你收藏的表达。</div>';
      return;
    }
    el.innerHTML = words.map(function(v){
      var sentence = v.context || "";
      var word = v.word || "";
      var idx = sentence ? sentence.toLowerCase().indexOf(word.toLowerCase()) : -1;
      var body = '';
      if(idx !== -1){
        var before = esc(sentence.slice(0, idx));
        var after = esc(sentence.slice(idx + word.length));
        body += '<div class="hook-sentence">' + before + '<input class="hook-input" data-answer="' + esc(word) + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="填表达">' + after + '</div>';
      } else {
        body += '<div class="hook-sentence">' + esc(word) + '</div>';
      }
      // 判断反馈
      body += '<div class="hook-feedback"></div>';
      // 提示（首字母 + 词义），初始隐藏
      var hint = makeHint(word);
      var hintInner = '';
      if(hint !== word) hintInner += '<div>首字母：' + esc(hint) + '</div>';
      if(v.def) hintInner += '<div>词义：' + esc(v.def) + '</div>';
      if(hintInner) body += '<div class="hook-hint">' + hintInner + '</div>';
      // 答案，初始隐藏
      body += '<div class="hook-answer">' + esc(word) + '</div>';
      // 操作按钮
      body += '<div class="hook-actions"><button class="hook-btn" data-act="check">确认</button><button class="hook-btn" data-act="hint">提示</button><button class="hook-btn" data-act="answer">看答案</button></div>';
      return '<div class="hook-item">' + body + '</div>';
    }).join('');
    el.querySelectorAll(".hook-item").forEach(function(item){
      var input = item.querySelector(".hook-input");
      var checkBtn = item.querySelector('[data-act="check"]');
      var hintBtn = item.querySelector('[data-act="hint"]');
      var ansBtn = item.querySelector('[data-act="answer"]');
      function doCheck(){
        if(!input) return;
        var ans = (input.value || "").trim().toLowerCase();
        var correct = (input.getAttribute("data-answer") || "").toLowerCase();
        var fb = item.querySelector(".hook-feedback");
        if(!fb) return;
        if(ans === correct){
          fb.textContent = "✓ 正确！";
          fb.className = "hook-feedback ok";
          input.disabled = true;
          item.classList.add("solved");
          if(checkBtn){ checkBtn.textContent = "✓"; checkBtn.disabled = true; }
        } else {
          fb.textContent = "✗ 不对，再想想";
          fb.className = "hook-feedback bad";
        }
      }
      if(checkBtn) checkBtn.addEventListener("click", doCheck);
      if(input) input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); doCheck(); } });
      if(hintBtn) hintBtn.addEventListener("click", function(){
        var on = item.classList.toggle("hinted");
        hintBtn.textContent = on ? "收起提示" : "提示";
      });
      if(ansBtn) ansBtn.addEventListener("click", function(){
        var on = item.classList.toggle("revealed");
        ansBtn.textContent = on ? "收起答案" : "看答案";
      });
    });
  }

  function removeArticle(id){
    if(!confirm("删除这篇文章？")) return;

  /* ================= reader ================= */
  function openReader(id){
    var a = state.articles.find(function(x){return x.id===id;});
    if(!a) return;
    state.currentId = id;
    a.lastReadAt = Date.now();
    save();
    try { localStorage.setItem("flip.last.v1", id); } catch(e){}

    $("readerTitle").textContent = a.title;
    $("readerMeta").innerHTML = [
      a.source ? "<span>"+esc(a.source)+"</span>" : "",
      "<span>"+fmtDate(a.createdAt)+"</span>",
      "<span>"+fmtNum(a.words)+" 词</span>",
      "<span>约 "+Math.max(1,Math.round(a.words/WPM))+" 分钟</span>"
    ].join("");
    $("readerBody").innerHTML = a.bodyHtml || renderText(a.text);

    $("library").style.display = "none";
    $("vocabView").classList.remove("open");
    $("ecoView").classList.remove("open");
    $("reader").classList.add("open");
    hideSelToolbar();
    closeDict();
    window.scrollTo(0,0);

    // 恢复阅读进度
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var max = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo(0, (a.progress||0) * max);
        updateProgress(true);
      });
    });
    applySettings();
  }

  function closeReader(){
    var a = state.articles.find(function(x){return x.id===state.currentId;});
    if(a) persistProgress(a);
    $("reader").classList.remove("open");
    $("vocabView").classList.remove("open");
    $("ecoView").classList.remove("open");
    $("library").style.display = "block";
    state.currentId = null;
    try { localStorage.removeItem("flip.last.v1"); } catch(e){}
    hideSelToolbar();
    closeDict();
    render();
    window.scrollTo(0,0);
  }

  function updateProgress(force){
    var a = state.articles.find(function(x){return x.id===state.currentId;});
    if(!a) return;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    $("progressFill").style.width = (p*100)+"%";
    if(force || true){
      clearTimeout(state.scrollT);
      state.scrollT = setTimeout(function(){ persistProgress(a); }, 400);
    }
  }
  function persistProgress(a){
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    a.progress = p;
    if(p >= 0.95) a.finished = true;
    save();
    var doneEl = $("readerDone");
    if(doneEl) doneEl.textContent = a.finished ? "已读完 · " + fmtNum(a.words) + " 词" : "";
  }

  function nextRandom(){
    var pool = state.articles.filter(function(x){ return x.id !== state.currentId; });
    var unread = pool.filter(function(x){ return statusOf(x)==="unread"; });
    var pick = (unread.length ? unread : pool);
    if(!pick.length){ toast("只有这一篇了"); return; }
    var a = pick[Math.floor(Math.random()*pick.length)];
    openReader(a.id);
  }

  /* ================= 划线 / 查字典 / 生词本 ================= */
  var dictCurrent = null;

  function hideSelToolbar(){ $("selToolbar").classList.remove("show"); }
  function showSelToolbar(rect){

    if(rect && (rect.width || rect.height)){
      x = rect.left + rect.width/2 - tb.offsetWidth/2;

    } else {
      // 选区定位失败时，默认显示在屏幕中上部
      x = (window.innerWidth - tb.offsetWidth) / 2;
      y = Math.max(8, window.innerHeight / 3);
    }
    x = Math.max(8, Math.min(x, window.innerWidth - tb.offsetWidth - 8));
    y = Math.max(8, y);
    tb.style.left = x + "px";
    tb.style.top = y + "px";
  }
  function showExprTip(word, meaning, rect){

    $("exprTipMeaning").textContent = meaning;
    tip.classList.add("show");

    }
    x = Math.max(8, Math.min(x, window.innerWidth - tip.offsetWidth - 8));

  function currentArticle(){
    return state.articles.find(function(x){ return x.id === state.currentId; });
  }
  function extractContext(range){
    try {
      var node = range.startContainer;
      var p = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
      while(p && p !== $("readerBody") && !/^(P|DIV|LI|BLOCKQUOTE|H[1-6])$/.test(p.tagName || "")){
        p = p.parentNode;
      }
      if(p && p !== $("readerBody")){
        var full = (p.textContent || "").replace(/\s+/g, " ").trim();
        var sel = (state.lastSelText || "").trim();
        // 提取词所在的「那一句」作为原文例句
        var idx = sel ? full.toLowerCase().indexOf(sel.toLowerCase()) : -1;
        if(idx !== -1){
          var start = idx;
          while(start > 0 && !/[.!?]/.test(full[start - 1])){ start--; }
          var end = idx + sel.length;
          while(end < full.length && !/[.!?]/.test(full[end])){ end++; }
          if(end < full.length) end++;
          var sent = full.slice(start, end).trim();
          if(sent) return sent;
        }
        // 兜底：返回整段（截断）
        if(full.length > 200) full = full.slice(0, 200) + "…";
        return full;
      }
    } catch(e){}
    return "";
  }
  function findContextByWord(word){
    try {
      var a = currentArticle();
      if(!a || !word) return "";
      var text = a.text || "";
      var idx = text.toLowerCase().indexOf(String(word).toLowerCase());
      if(idx === -1) return "";
      var start = idx;
      while(start > 0 && !/[.!?]/.test(text[start - 1])){ start--; }
      var end = idx + String(word).length;
      while(end < text.length && !/[.!?]/.test(text[end])){ end++; }
      if(end < text.length) end++;
      var sent = text.slice(start, end).trim();
      return sent || "";
    } catch(e){ return ""; }
  }
  function highlightSelection(){

    try {

  function parseExpressions(md){
    var map = {};
    if(!md) return map;
    md.split("\n").forEach(function(line){
      var m = line.match(/^\*\*(.+?)\*\*\s*[—\-–]\s*(.+)$/);
      if(m){
        var key = m[1].trim().toLowerCase().replace(/\((?:sth|sb|one's[^)]*)\)/g, "").trim();
        map[key] = m[2].trim();
      }
    });
    return map;
  }
  function findExpression(word){
    if(!word) return null;
    var w = String(word).trim().toLowerCase();
    if(!w) return null;
    if(state.expressions[w]) return { word: w, meaning: state.expressions[w] };
    var stem = w.replace(/(ing|ed|es|s)$/, "");
    for(var key in state.expressions){
      if(!Object.prototype.hasOwnProperty.call(state.expressions, key)) continue;
      if(key === stem || key.indexOf(w) !== -1 || w.indexOf(key) !== -1){
        return { word: key, meaning: state.expressions[key] };
      }
    }
    return null;
  }

  /* ================= 划词解析短语 ================= */
  var PARSE_SYSTEM_PROMPT = "你是一位英语精读老师。用户划选了一段英文，请做精读解析，不要只做中文直译。\n按三节输出（Markdown）：\n### 1. 关键短语\n逐个解释最关键的固定搭配/习语/难词，每条写：**英文短语**：中文释义 + 在句中的具体含义/指代（代词指谁、隐喻指什么）。不要逐词拆，不要分析主谓宾。\n### 2. 句式结构\n用 1-2 句说明句子主干（谁 + 做了什么）+ 修饰成分/从句及其作用。\n### 3. 整句意思\n用符合中文习惯的大白话翻译整句。\n要求具体准确，尤其说清指代和隐喻，不要空泛套话；总字数 250 字以内。";
  var PARSE_BASE_URL = "https://api.siliconflow.cn/v1";

  var PARSE_DEFAULT_KEY = "sk-wmygstyhlcydcafsehbaqzzoznftmbfkumqlcdfssgcxrvib";

  function showParse(content){
    $("parseBody").innerHTML = renderText(content);
    $("parsePanel").classList.add("show");
  }
  function parsePhrase(text){
    // 查过的句子直接用缓存，不再调用 API（忽略多余空白差异）
    var norm = function(s){ return String(s || "").replace(/\s+/g, " ").trim(); };
    var hit = state.takeaways.find(function(t){ return norm(t.phrase) === norm(text); });
    if(hit){ showParse(hit.analysis); return; }
    var apiKey = getParseKey();
    if(!apiKey){ openKeyModal(); toast("请先填写 API Key"); return; }
    $("parseBody").innerHTML = '<div class="dict-loading">解析中 … 可能需要 5–40 秒，请稍候</div>';
    $("parsePanel").classList.add("show");
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = null;
    if(ctrl){ timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 60000); }
    fetch(PARSE_BASE_URL + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: JSON.stringify({
        model: getParseModel(),
        messages: [
          { role: "system", content: PARSE_SYSTEM_PROMPT },
          { role: "user", content: text }
        ],
        temperature: 0.3
      }),
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(r){
      if(!r.ok){
        return r.text().then(function(t){
          var msg = "HTTP " + r.status;
          try {
            var j = JSON.parse(t);
            if(j && j.message) msg = j.message;
            if(j && (j.code === 30001 || /balance/i.test(j.message || ""))) msg = "账户余额不足，请到硅基流动控制台充值后再试";
          } catch(e){}
          throw new Error(msg);
        });
      }
      return r.json();
    })
    .then(function(d){
      clearTimeout(timer);
      var content = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "";
      if(!content.trim()) throw new Error("空结果");
      var a = currentArticle();
      state.takeaways.unshift({ id: uid(), phrase: text, analysis: content, articleTitle: a ? a.title : "", createdAt: Date.now() });
      saveTakeaways();
      showParse(content);
    })
    .catch(function(e){
      clearTimeout(timer);
      var msg = (e && e.name === "AbortError") ? "请求超时（模型较慢或网络不稳），请重试" : (e.message || "网络或 Key 问题");
      $("parseBody").innerHTML = '<div class="dict-err">解析失败：' + esc(msg) + '</div>';
    });
  }
  function loadDictCn(){
    if(state.dictCn) return Promise.resolve(state.dictCn);

      .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })

  function lookupWord(word, ctx){
    dictCurrent = null;
    $("dictWord").textContent = word;
    $("dictPh").textContent = "";
    $("dictBody").innerHTML = '<div class="dict-loading">查询中 …</div>';
    $("dictPanel").classList.add("show");

    var cnText = null, enData = null, done = 0, called = false;
    var timer = setTimeout(finishAll, 12000);
    function finishAll(){
      if(called) return;
      called = true; clearTimeout(timer);
      renderDict(word, enData, ctx, cnText);
    }
    loadDictCn().then(function(dict){
      var w = word.toLowerCase();
      cnText = (dict[w] || dict[word] || "");
      done++; if(done >= 2) finishAll();
    });
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    try {
      fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word), ctrl ? { signal: ctrl.signal } : {})
        .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
        .then(function(data){ enData = data; done++; if(done >= 2) finishAll(); })
        .catch(function(){ enData = null; done++; if(done >= 2) finishAll(); });
    } catch(e){ enData = null; done++; if(done >= 2) finishAll(); }
  }
  function renderDict(word, data, ctx, cnText){
    var context = ctx || "";
    if(!context){
      var vitem = state.vocab.find(function(v){ return v.word.toLowerCase() === word.toLowerCase(); });
      if(vitem) context = vitem.context || "";
    }

    var html = "";
    // 版块 1：Read between the lines（此处含义）
    if(context){
      html += '<div class="dict-section">Read between the lines</div>';
      html += '<div class="dict-context">' + esc(context) + '</div>';
    }

    // 版块 2：柯林斯英汉双解（离线）
    if(cnText){
      html += '<div class="dict-section">柯林斯英汉双解</div>';
      cnText.split("  /  ").slice(0, 5).forEach(function(s){
        if(s.trim()) html += '<div class="dict-cn">' + esc(s.trim()) + '</div>';
      });
    }

    // 版块 3：Steal like an artist（英文释义 + 例句）
    var firstDef = "", examples = [];
    if(Array.isArray(data) && data.length){
      var entry = data[0];
      $("dictWord").textContent = entry.word || word;
      $("dictPh").textContent = entry.phonetic ? "/" + entry.phonetic + "/" : "";
      html += '<div class="dict-section">Steal like an artist</div>';
      (entry.meanings || []).forEach(function(m){
        html += '<div class="dict-pos">' + esc(m.partOfSpeech || "") + '</div>';
        (m.definitions || []).slice(0, 3).forEach(function(d){
          html += '<div class="dict-def">' + esc(d.definition) + '</div>';
          if(!firstDef && d.definition) firstDef = d.definition;
          if(d.example) examples.push(d.example);
        });
      });
      if(examples.length){
        html += '<div class="dict-pos">例句</div>';
        examples.slice(0, 2).forEach(function(ex, i){
          html += '<div class="dict-example"><span class="dict-ex-num">' + (i+1) + '</span><span>' + esc(ex) + '</span></div>';
        });
      }
      dictCurrent = { word: entry.word || word, phonetic: entry.phonetic || "", def: cnText || firstDef, context: context };
    } else {
      $("dictWord").textContent = word;
      $("dictPh").textContent = "";
      if(!cnText) html += '<div class="dict-err">词典里没找到「' + esc(word) + '」</div>';

    var t = e.target;
    while(t && t !== $("readerBody")){
      if(t.tagName && t.tagName.toLowerCase() === "mark" && t.classList && t.classList.contains("hl")){
        var word = (t.textContent || "").trim();
        if(word){ lookupWord(word); }
        return;
      }
      t = t.parentNode;
    }
  });

  // 屏蔽 iOS Safari 长按系统菜单（拷贝/查询/翻译），保留正文选字能力
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  document.addEventListener("selectstart", function(e){
    // 正文区域保留选字（查词依赖选区）；正文之外阻止意外选字
    var t = e.target, inBody = false;
    while(t && t !== document){
      if(t === $("readerBody")){ inBody = true; break; }
      t = t.parentNode;
    }
    if(!inBody) e.preventDefault();
  });

  // 事件绑定
  $("lightCard").addEventListener("click", function(){
    if(state.light && state.light.id) openReader(state.light.id);
  });
  $("exprCard").addEventListener("click", function(){ openReader("builtin-vocab"); });
  $("moduleVocab").addEventListener("click", openVocab);
  $("vocabBack").addEventListener("click", closeVocab);
  $("ecoBack").addEventListener("click", closeEco);
  $("featuredCard").addEventListener("click", function(){
    if(state.featured && state.featured.id) openReader(state.featured.id);
  });
  $("dictClose").addEventListener("click", closeDict);
  $("parseClose").addEventListener("click", closeParse);
  ["hlBtn","vocabBtn","dictBtn","parseBtn"].forEach(function(id){
    $(id).addEventListener("pointerdown", function(e){
      e.preventDefault();
      // 兜底：部分环境（尤其 iOS）点按钮会先清空选区，这里在清空前先存一份
      var sel = window.getSelection();
      if(sel && !sel.isCollapsed){
        var t = (sel.toString() || "").trim();
        if(t && t.length <= 80){
          state.lastSelText = t;
          try { state.savedRange = sel.getRangeAt(0).cloneRange(); } catch(e2){}
        }
      }
    });
    $(id).addEventListener("mousedown", function(e){ e.preventDefault(); });
  });
  $("hlBtn").addEventListener("click", onHighlight);
  $("vocabBtn").addEventListener("click", onAddVocab);
  $("dictBtn").addEventListener("click", onDict);
  $("parseBtn").addEventListener("click", onParse);
  $("keyBtn").addEventListener("click", openKeyModal);
  $("keyClose").addEventListener("click", function(){ $("keyModal").classList.remove("show"); });
  $("keySave").addEventListener("click", saveKeyModal);
  $("keyModal").addEventListener("click", function(e){ if(e.target === $("keyModal")) $("keyModal").classList.remove("show"); });

  /* ================= settings ================= */
  function applySettings(){
    var s = state.settings;
    document.documentElement.style.setProperty("--reader-size", s.fontSize+"px");
    document.documentElement.style.setProperty("--reader-font", s.serif ? "var(--serif)" : "var(--sans)");
    document.body.classList.toggle("dark", s.dark);
    $("fontToggle").textContent = s.serif ? "无衬线" : "衬线";
    $("fontToggle").classList.toggle("on", s.serif);
    $("themeToggle").textContent = s.dark ? "浅色" : "深色";
    $("themeToggle").classList.toggle("on", s.dark);
  }
  function setFont(delta){
    state.settings.fontSize = Math.min(26, Math.max(15, state.settings.fontSize + delta));
    saveSettings(); applySettings();
  }

  /* ================= events ================= */
  $("importBtn").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){ importFiles(e.target.files); e.target.value=""; });

  $("shuffleBtn").addEventListener("click", function(){
    var pool = state.articles;
    if(!pool.length){ toast("先导入几篇文章吧"); return; }
    openReader(pool[Math.floor(Math.random()*pool.length)].id);
  });

  // search / filters 已随首页文章列表移除

  // reader
  $("backBtn").addEventListener("click", closeReader);
  $("endBackBtn").addEventListener("click", closeReader);
  $("nextBtn").addEventListener("click", nextRandom);
  $("fontUp").addEventListener("click", function(){ setFont(1); });
  $("fontDown").addEventListener("click", function(){ setFont(-1); });
  $("fontToggle").addEventListener("click", function(){ state.settings.serif = !state.settings.serif; saveSettings(); applySettings(); });
  $("themeToggle").addEventListener("click", function(){ state.settings.dark = !state.settings.dark; saveSettings(); applySettings(); });

  // title edit
  $("readerTitle").addEventListener("blur", function(){
    var a = state.articles.find(function(x){return x.id===state.currentId;});
    if(!a) return;
    var t = $("readerTitle").textContent.trim();
    if(t && t !== a.title){ a.title = t; save(); }
  });
  $("readerTitle").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); $("readerTitle").blur(); }
  });

  // scroll progress
  window.addEventListener("scroll", function(){
    if($("reader").classList.contains("open")) updateProgress();
  }, { passive: true });

  // keyboard
  window.addEventListener("keydown", function(e){
    if(e.key === "Escape" && $("reader").classList.contains("open")){ closeReader(); }
  });

  // drag & drop
  var dragDepth = 0;
  window.addEventListener("dragenter", function(e){ e.preventDefault(); dragDepth++; $("dropOverlay").classList.add("show"); });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("dragleave", function(e){ e.preventDefault(); dragDepth--; if(dragDepth<=0){ dragDepth=0; $("dropOverlay").classList.remove("show"); } });
  window.addEventListener("drop", function(e){
    e.preventDefault(); dragDepth=0; $("dropOverlay").classList.remove("show");
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });

  /* ================= init ================= */
  // 迁移：旧默认字号 19 → 17（避免老用户停留在大字号）
  if(state.settings.fontSize === 19){ state.settings.fontSize = 17; saveSettings(); }
  applySettings();
  injectBuiltin();
  // 刷新后恢复上次阅读的文章（若仍存在）
  var lastId = null;
  try { lastId = localStorage.getItem("flip.last.v1"); } catch(e){}
  if(lastId && state.articles.some(function(a){ return a.id === lastId; })){
    openReader(lastId);
  } else {
    render();
  }
  // 后台预加载柯林斯词典，查词秒出
  setTimeout(function(){ loadDictCn(); }, 600);
  if(!storageOk){
    setTimeout(function(){
      toast("⚠️ 当前环境无法使用本地存储：文章只在本次打开时有效，建议用浏览器直接打开 http://127.0.0.1:8090/flip-reader.html");
    }, 300);
  }
})();
</script>
</body>
</html>
